<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多来源商品数据合并时序图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'Hiragino Sans', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1160px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>多来源商品数据合并时序图</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="merge-seq-title merge-seq-desc">
      <title id="merge-seq-title">多来源商品数据合并时序图</title>
      <desc id="merge-seq-desc">时序图展示多来源商品数据从接入存储、属性处理、候选与匹配到图聚类的执行顺序，并包含审核结果回流。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines: dashed vertical lines behind all messages -->
      <line x1="136" y1="140" x2="136" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="304" y1="140" x2="304" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="472" y1="140" x2="472" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="648" y1="140" x2="648" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="824" y1="140" x2="824" y2="484" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="300" y="172" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="468" y="252" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="644" y="292" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="820" y="332" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->

      <!-- M1: 数据源 -> 接入与存储 -->
      <line x1="136" y1="168" x2="304" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M2: 接入与存储 self-message -->
      <path d="M 308 208 L 344 208 L 344 224 L 308 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M3: 接入与存储 -> 属性处理 -->
      <line x1="304" y1="248" x2="472" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M4: 属性处理 -> 候选与匹配 -->
      <line x1="472" y1="288" x2="648" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M5: 候选与匹配 -> 图谱与输出 -->
      <line x1="648" y1="328" x2="824" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M6: 图谱与输出 -> 接入与存储（主输出 · coral） -->
      <line x1="824" y1="368" x2="304" y2="368" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- M7: 图谱与输出 -> 属性处理（异步回流 · open marker） -->
      <line x1="824" y1="408" x2="472" y2="408" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- Message labels: each with opaque paper mask and 8px gap above the line -->

      <rect x="168" y="148" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">写入品牌/分类/标题</text>

      <rect x="156" y="212" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="204" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">统一记录格式</text>

      <rect x="332" y="228" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="237" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">提供标准化记录</text>

      <rect x="488" y="268" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="277" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">输出属性/型号与置信度</text>

      <rect x="664" y="308" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">输出候选对与匹配证据</text>

      <rect x="492" y="348" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="564" y="357" fill="#eb6c36" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">输出实体组与冲突标记</text>

      <rect x="600" y="388" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="397" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle" letter-spacing="0.04em">审核结果回流</text>

      <!-- Actor boxes: drawn after labels so fills stay on top -->

      <!-- SRC: 数据源 (input treatment) -->
      <rect x="72" y="72" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="72" width="128" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="94" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="136" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">数据源</text>
      <text x="136" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">雷小安 · 腕表之家 · 奢当家</text>

      <!-- ING: 接入与存储 (store treatment) -->
      <rect x="248" y="72" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="72" width="112" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="256" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="272" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="304" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">接入与存储</text>
      <text x="304" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">raw_records · Iceberg</text>

      <!-- NLP: 属性处理 (backend treatment) -->
      <rect x="408" y="72" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="72" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.28)" stroke-width="0.8"/>
      <text x="430" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NLP</text>
      <text x="472" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">属性处理</text>
      <text x="472" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">GLiNER2 · 规范化</text>

      <!-- MATCH: 候选与匹配 (backend treatment) -->
      <rect x="584" y="72" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="72" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="592" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.28)" stroke-width="0.8"/>
      <text x="608" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATCH</text>
      <text x="648" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">候选与匹配</text>
      <text x="648" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">Blocking · 打分</text>

      <!-- GRAPH: 图谱与输出 (focal treatment) -->
      <rect x="760" y="72" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="72" width="128" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="768" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="784" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRAPH</text>
      <text x="824" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">图谱与输出</text>
      <text x="824" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace" text-anchor="middle">聚类 · 实体组 · 审核</text>

      <!-- Legend: horizontal strip at the bottom -->
      <line x1="56" y1="504" x2="904" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="56" y1="546" x2="84" y2="546" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="92" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">数据写入</text>

      <line x1="196" y1="546" x2="224" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="232" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">异步回流</text>

      <line x1="340" y1="546" x2="368" y2="546" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="376" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">主输出</text>

      <rect x="488" y="536" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="500" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">激活区间</text>

      <line x1="608" y1="546" x2="636" y2="546" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="644" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">生命线</text>

      <rect x="748" y="540" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="768" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans SC', sans-serif">焦点组件</text>
    </svg>
  </div>
</body>
</html>
