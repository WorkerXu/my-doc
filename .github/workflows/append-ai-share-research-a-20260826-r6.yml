name: Append AI share research c 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-research-a-20260826-r6.yml'

permissions:
  contents: write

jobs:
  append-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append unique research rows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ARTICLE='ai分享文章调研.md'
          HISTORY='ai分享历史调研.md'

          append_selected() {
            local reason="$1"
            local url="$2"
            if ! grep -Fq "$url" "$ARTICLE"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$ARTICLE"
            fi
            if ! grep -Fq "$url" "$HISTORY"; then
              printf '| %s |\n' "$url" >> "$HISTORY"
            fi
          }

          apply_entries() {
            append_selected 'Claude Code Agent Teams 从核心概念、底层架构一路做到真实项目实测，由 Team Lead 拆任务、多个 Teammate 并行执行并互相通信，适合分享原生 Coding Agent 团队如何解决长上下文、串行瓶颈和单一视角问题。' 'https://www.bilibili.com/video/BV1gwcAzkEhw'
            append_selected 'Multica 直接以多 Agent 编排工具做完整实战演示，适合补充“编排平台如何从概念落到实际操作”的视角，用来观察多 Agent 团队怎样被组织并进入可执行工作流。' 'https://www.bilibili.com/video/BV1Vvj86UEW4'
            append_selected 'Hermes + DeepSeek Harness 实测让多个 Agent 在同一任务中讨论、分工、推进，再与真人共同收敛结果，覆盖需求拆解、代码修改和方案讨论，适合展示“Agent 团队 + Human-in-the-loop”的轻量协作落地。' 'https://www.bilibili.com/video/BV1FahK6eEef'
            append_selected 'oh-my-opencode 用编排器指挥 GPT、Claude、Gemini 分工协作，并结合 LSP 语义感知与 Ralph Loop 约束代码质量和任务收敛，适合分享跨模型 Coding Agent 怎样把编排、语义校验和完成度控制组合起来。' 'https://www.bilibili.com/video/BV1ZBiRBrErU'
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            apply_entries

            if git diff --quiet -- "$ARTICLE" "$HISTORY"; then
              echo 'No new entries to append.'
              exit 0
            fi

            git add "$ARTICLE" "$HISTORY"
            git commit -m 'docs: append fresh Bilibili multi-agent research'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying from latest main"
          done

          echo 'Failed to push after retries' >&2
          exit 1
