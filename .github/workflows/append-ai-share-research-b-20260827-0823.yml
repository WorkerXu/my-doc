name: Append AI sharing research b 20260827 0823

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-research-b-20260827-0823.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append new research rows safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          article = Path('ai分享文章调研.md')
          history = Path('ai分享历史调研.md')

          rows = [
              ('来自真实 10 Agent 生产环境的 OpenClaw 团队模板，把 Telegram topic 路由、sessions_send 标准化交接、共享上下文、升级链以及 Build→QA→Deploy 接力都落成可运行配置，适合分享“小型 AI 团队如何长期稳定协作”的工程细节。', 'https://github.com/raulvidis/openclaw-multi-agent-kit'),
              ('用 Claude Code Hooks 把多 Agent 的工具调用、任务 handoff、Subagent 生命周期、失败与权限事件实时写入 SQLite 并通过 WebSocket 看板追踪，适合补充“协作系统上线后如何定位是哪一个 Agent、哪次交接出了问题”的可观测性实践。', 'https://github.com/disler/claude-code-hooks-multi-agent-observability'),
              ('以 LangGraph + LangSmith 从两个专业 Subagent、Supervisor 路由一路补齐短/长期记忆、Human-in-the-Loop、Tracing 与 Evaluation，并用真实客服流程逐步实现，适合作为“多 Agent 不只要能协作，还要可调试、可评估”的可复现实操。', 'https://github.com/FareedKhan-dev/Multi-Agent-AI-System'),
              ('GHC Dispatch 的 Agent Teams 文档把 Lead→专业成员→汇总验收定义成异步协作协议，强调有边界任务、可追踪 handoff、Lead 先验证再综合，并明确反对过度并行和模糊目标，适合提炼一套框架无关的团队协作纪律。', 'https://github.com/boddev/ghc-dispatch/blob/master/agents/teams.md'),
          ]

          article_text = article.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')

          added = []
          for reason, url in rows:
              if url in article_text or url in history_text:
                  continue
              if article_text and not article_text.endswith('\n'):
                  article_text += '\n'
              article_text += f'| {reason} | {url} |\n'
              if history_text and not history_text.endswith('\n'):
                  history_text += '\n'
              history_text += f'| {url} |\n'
              added.append(url)

          if added:
              article.write_text(article_text, encoding='utf-8')
              history.write_text(history_text, encoding='utf-8')
              print(f'added {len(added)} rows')
          else:
              print('no new rows')
          PY

            if git diff --quiet -- 'ai分享文章调研.md' 'ai分享历史调研.md'; then
              echo 'no new rows to commit'
              exit 0
            fi

            git add -- 'ai分享文章调研.md' 'ai分享历史调研.md'
            git commit -m 'docs: append ai sharing research b 20260827'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push failed on attempt ${attempt}; retrying on latest main"
          done

          exit 1
