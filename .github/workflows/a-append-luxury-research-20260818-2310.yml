name: a append luxury research 20260818 2310

on:
  push:
    paths:
      - '.github/workflows/a-append-luxury-research-20260818-2310.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append a luxury research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('2026 年 Visual Product Search Benchmark 直接要求从持续演化的大型目录中检索 exact object instance，并统一评测多类视觉 embedding；适合把图片作为同 reference 候选召回与辅助否决的现实基准，重点检查外观近似但 reference 不同的误召回风险。', 'https://arxiv.org/abs/2603.17186'),
              ('PRISM 用 SigLIP 候选召回、YOLO-E 去背景、LightGlue 细粒度像素匹配三阶段处理高度相似商品；可用于区分 near-identical hard negatives 和图片侧复核，但最终同款仍必须由 canonical reference 硬键确认。', 'https://arxiv.org/abs/2509.14985'),
              ('eBay eProduct 视觉搜索第一名 V2L 把视觉模型与视觉语言模型结合，并采用粗到细度量学习做大规模商品检索；适合千万级视觉候选召回和挖掘同系列近邻 hard negatives，最终身份仍以 canonical reference exact 为准。', 'https://arxiv.org/abs/2207.12994'),
              ('CaseBack 2026 以 brand+reference 驱动 Web 搜索自动补齐腕表规格，并把用户纠错再次外部验证后写回共享库；可参考其 reference→canonical specs→验证 的 enrichment 链路，辅助发现标题型号、规格或来源之间的冲突。', 'https://caseback.us/blog/caseback-ai-specs-valuations-research'),
              ('WatchIQ 明确区分 model/reference 与 serial，并按表背、表耳、保卡等位置给出取证路径；适合建立编号角色分类和 OCR 位置优先级，避免把单表序列号或其他局部编号误当跨源同款 reference。', 'https://watchiq.app/identify/find-watch-model-number/'),
              ('京东商品命名的密集实体识别实践覆盖 52 类实体，并利用大规模无标注语料、增量预训练和半监督思路处理实体紧邻与边界错误；适合 reference 埋在长标题且与品牌、规格连写时做 token 级抽取，再进入品牌型号库 exact 校验。', 'https://zhuanlan.zhihu.com/p/547067960'),
              ('Cleanlab 面向 messy data 与 noisy labels 提供标签问题、异常和 OOD 检测；只有几百对黄金标签时，可优先审计同系列相邻 reference 的误标正负例，避免少量错标签破坏 precision-first verifier 的高精度边界。', 'https://github.com/cleanlab/cleanlab'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY

            if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
              exit 0
            fi

            git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
            git commit -m 'a 追加本轮奢侈品文章调研 2310'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
