name: b GLiNER2 append

on:
  push:
    paths:
      - '.github/workflows/b-gliner2-append.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research and cleanup
        shell: bash
        run: |
          set -euo pipefail
          url='https://huggingface.co/morilinger/gliner-fahrzeugschein-onnx'
          row='| gliner-fahrzeugschein-onnx 直接基于 GLiNER2 训练并导出 ONNX，Schema 明确抽取 brand、model、VIN、功率、排量、重量、颜色等字段；虽然场景是车辆证件，但与商品“品牌+型号+结构化属性”抽取高度同构，适合参考 GLiNER2 字段定义、领域微调、ONNX 部署及字母数字型号识别。 | https://huggingface.co/morilinger/gliner-fahrzeugschein-onnx |'
          grep -Fqx "$row" 'GLiNER2文章调研.md' || printf '%s\n' "$row" >> 'GLiNER2文章调研.md'
          grep -Fqx "$url" 'GLiNER2历史调研.md' || printf '%s\n' "$url" >> 'GLiNER2历史调研.md'
          rm -f '.github/workflows/b-gliner2-append.yml'
          git config user.name 'b'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md' '.github/workflows/b-gliner2-append.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'b 追加本轮 GLiNER2 商品字段调研'
          git push
