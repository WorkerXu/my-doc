name: Append exhibition research a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-exhibition-research-a-20260817.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append deduplicated research
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          research_path = Path('展会调研/展会文章调研.md')
          history_path = Path('展会调研/展会文章历史调研.md')
          workflow_path = Path('.github/workflows/append-exhibition-research-a-20260817.yml')

          items = [
              ('MarkIT 用 React + TypeScript + Konva 实现活动场地管理：在 Canvas 中拖拽、旋转和锁定桌位/场地元素，把 vendor 分配到具体位置并按签到状态高亮，适合参考运营编辑端、热区对象与业务实体绑定。', 'https://github.com/JustinDotRocks/MarkIT-V1.1'),
              ('PPOCRLabel 是 PaddleOCR 的半自动 OCR 标注工具，内置识别模型并支持矩形/多点框、重新识别、顶点微调、缩放聚焦和人工校验，可直接参考“自动识别展位编号/区域 → 人工修正后发布”的审核交互。', 'https://github.com/PFCCLab/PPOCRLabel'),
              ('react-svg-seatmap 用既有 SVG 场地图与业务 seat ID/CSS selector 建立稳定绑定，提供缩放平移、分组着色、点击选择和受控状态，适合参考“图形热区 ↔ 展位实体 ↔ 占用状态”的前端组件设计。', 'https://github.com/aidankemp/react-svg-seatmap'),
              ('该项目提供类似 Figma 的场馆座位图编辑器，可作为运营端编辑和调整展位几何与交互图层的实现参考，尤其适合评估复杂大图编辑器中的画布操作与对象建模。', 'https://github.com/botonddombi/seat-maps-threejs'),
              ('LayoutParser 可直接加载 PDF/图片，执行版面检测与 OCR，并以统一的区间/矩形坐标结构返回区域、文本和可视化框；可用于把展位图中的编号与候选区域结构化后交给人工确认页。', 'https://github.com/Layout-Parser/layout-parser'),
              ('indoor-wayfinder 是 React 驱动的交互式室内 SVG 地图实现，并支持 PNG/JPEG 地图背景，可参考展馆底图上的交互层、缩放浏览和室内位置绑定。', 'https://github.com/KnotzerIO/indoor-wayfinder'),
              ('Scalabel 是成熟的开源 Web 视觉标注平台，支持在画布上创建并调整矩形、闭合多边形和顶点，可复用其标注交互思路构建 OCR 候选热区的人工确认与微调页面。', 'https://github.com/scalabel/scalabel'),
              ('Konva 官方 Seats Reservation 是可运行的 React + react-konva 选位案例，直接展示大量可点击图形的命中检测、hover、选中状态和 Canvas 选位流程，可作为“展位点击 → 预览/确认 → 状态变更”的轻量前端基线。', 'https://konvajs.org/docs/sandbox/Seats_Reservation.html'),
              ('《前端通用交互式几何编辑器的开发经验》总结了二维 Canvas/地图通用的绘制、编辑、Hover、撤销、坐标契约与渲染适配分层，适合设计可维护的热区校正组件，并保持 PC 与不同渲染端的坐标一致性。', 'https://zhuanlan.zhihu.com/p/2069864745453220248'),
          ]

          research = research_path.read_text(encoding='utf-8')
          history = history_path.read_text(encoding='utf-8')

          url_re = re.compile(r'https?://[^|\s]+')
          def norm(url: str) -> str:
              return url.strip().rstrip('/')

          existing = {norm(u) for u in url_re.findall(research + '\n' + history)}
          added = []
          for reason, url in items:
              if norm(url) in existing:
                  continue
              if not research.endswith('\n'):
                  research += '\n'
              research += f'| {reason} | {url} |\n'
              if not history.endswith('\n'):
                  history += '\n'
              history += f'| {url} |\n'
              existing.add(norm(url))
              added.append(url)

          research_path.write_text(research, encoding='utf-8')
          history_path.write_text(history, encoding='utf-8')
          workflow_path.unlink(missing_ok=True)
          print(f'added={len(added)}')
          for url in added:
              print(url)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '展会调研/展会文章调研.md' '展会调研/展会文章历史调研.md' '.github/workflows/append-exhibition-research-a-20260817.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Append exhibition research findings"
          git push
