name: repair-gliner2-research

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == '临时修复 GLiNER2 调研追加'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original and append new research
        shell: bash
        run: |
          git show 99258266a6d7a17f119faf78970b05c3994ad8c3^:"GLiNER2文章调研.md" > "GLiNER2文章调研.md"
          python3 - <<'PY'
          from pathlib import Path

          url = "https://arxiv.org/abs/2607.26780"
          row = "| 该研究针对商品信息抽取提出“PLM 一次预测 + LLM 二次校验”的两阶段验证，并专门提升弱表达、低显著度字段的识别，同时支持本地部署；适合给 GLiNER2 的品牌、型号、规格等低置信度结果增加轻量复核层，减少漏抽和误抽。 | https://arxiv.org/abs/2607.26780 |"

          article = Path("GLiNER2文章调研.md")
          text = article.read_text(encoding="utf-8").rstrip("\n")
          if url not in text:
              article.write_text(text + "\n" + row + "\n", encoding="utf-8")

          history = Path("GLiNER2历史调研.md")
          h = history.read_text(encoding="utf-8").rstrip("\n")
          if url not in h.splitlines():
              history.write_text(h + "\n" + url + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "GLiNER2文章调研.md" "GLiNER2历史调研.md"
          git commit -m "修正并追加 GLiNER2 商品字段提取调研"
          git push