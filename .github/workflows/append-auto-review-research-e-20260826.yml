name: Append auto review research e 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-auto-review-research-e-20260826.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fq "$url" "$article" && ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append '介绍 Codex App 的多 Agent 并行协作与集中调度形态，适合作为把独立 reviewer、实现 Agent 与后续修复线程统一放入 Codex 工作台的参考。' 'https://juejin.cn/post/7602177588443463699'
          append '从架构层拆解 Codex 多 Agent 并行协作，适合参考如何把实现、审查和汇总角色分离，并将多路结果统一回收到 Codex 项目流程。' 'https://juejin.cn/post/7621066680340381739'
          append '展示 Claude、Gemini、Codex 的多 Agent 编排分工，适合借鉴为需求/设计/实现/测试分角色流水线，再额外接入独立 code-review Agent 形成交叉审查。' 'https://juejin.cn/post/7610981820637347880'
          append '围绕计划模式、子 Agent 与 workflow 的统一约束设计展开，适合参考把 plan 文件作为执行前置约束，并让 reviewer 子 Agent 在同一编排层核对计划与代码实现。' 'https://juejin.cn/post/7675326962214731785'
          append '讨论 AGENTS.md、Harness 与 Codex 的上下文治理，适合作为把计划文件、审查规则和自动化约束从冗长提示词转成可版本控制工程规则的参考。' 'https://juejin.cn/post/7676534960996941859'
          append '梳理 plan、subagent、code review、git worktree 等完整开发链路，适合作为将计划文件绑定 Git 工作流并在实现后增加独立审查 gate 的流程参考。' 'https://juejin.cn/post/7665897866712858674'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research e 20260826'
          git push
