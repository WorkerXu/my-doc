name: Append AI sharing research e 20260827 0833

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-research-e-20260827-0833.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append new Juejin multi-agent research rows safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          article = Path('ai分享文章调研.md')
          history = Path('ai分享历史调研.md')

          rows = [
              ('用自动修 GitHub Issue 并提 PR 的真实工作流演示主 Agent + Subagent 协作，覆盖并行、Pipeline、Map-Reduce，以及 workdir 隔离、push 回传、上下文自包含和成本控制等坑，适合分享“任务拆分后怎样把多 Agent 稳定跑起来”。', 'https://juejin.cn/post/7616650313060155443'),
              ('用 Spring AI + Java 从业务场景搭出可运行 Multi-Agent 系统并附完整源码，适合补充非 Python 团队如何把角色拆分、Agent 协作和现有 Spring 技术栈真正接起来。', 'https://juejin.cn/post/7633258779409252395'),
              ('基于 Spring AI Alibaba 1.1.2 实操 5 种多 Agent 编排模式，适合在分享中用 Java 生态对照不同协作拓扑的实现方式、适用边界与任务分工，而不是只讲单一 Supervisor 模式。', 'https://juejin.cn/post/7643288575245746185'),
              ('从“改 tasks.md 就让 Agent 自动接活写代码”出发自建多 Agent 研发工作流，适合展示需求文件如何变成任务触发器，以及多 Agent 怎样嵌入真实开发流水线而不是停留在聊天式 Demo。', 'https://juejin.cn/post/7623974008200347675'),
          ]

          article_text = article.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')

          added = []
          for reason, url in rows:
              if url in article_text or url in history_text:
                  continue
              if article_text and not article_text.endswith('\n'):
                  article_text += '\n'
              article_text += f'| {reason} | {url} |\n'
              if history_text and not history_text.endswith('\n'):
                  history_text += '\n'
              history_text += f'| {url} |\n'
              added.append(url)

          if added:
              article.write_text(article_text, encoding='utf-8')
              history.write_text(history_text, encoding='utf-8')
              print(f'added {len(added)} rows')
          else:
              print('no new rows')
          PY

            if git diff --quiet -- 'ai分享文章调研.md' 'ai分享历史调研.md'; then
              echo 'no new rows to commit'
              exit 0
            fi

            git add -- 'ai分享文章调研.md' 'ai分享历史调研.md'
            git commit -m 'docs: append ai sharing research e 20260827'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push failed on attempt ${attempt}; retrying on latest main"
          done

          exit 1
