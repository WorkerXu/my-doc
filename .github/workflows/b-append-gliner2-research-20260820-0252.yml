name: b append gliner2 research 20260820 0252

on:
  push:
    paths:
      - '.github/workflows/b-append-gliner2-research-20260820-0252.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append b GLiNER2 research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('GLiNER2文章调研.md')
          history = Path('GLiNER2历史调研.md')
          entries = [
              ('该项目用 AWS Textract OCR 配合 spaCy 自定义 NER，从商品图片文字中识别 product name、brand、price；适合在 GLiNER2 文本链路前增加包装/图片 OCR 兜底，再按 brand/model/规格 Schema 做统一抽取与校验。', 'https://github.com/jeevan251203/Product_Info_Extraction_using_OCR'),
              ('该项目直接从商品描述抽取 attribute-value pairs，并专门讨论 noisy descriptions 与 seed data generation 难题；适合用作 GLiNER2 在脏商品描述、少标注/弱监督场景下的传统基线和困难样本构造参考。', 'https://github.com/vamsilnm/Attribute-Value-Extraction'),
              ('Ferret 是开源声明式数据抽取运行时，商品示例可从网页直接取得 brand/title/price，并支持按 Schema 对 HTML 做 AI 结构化抽取；适合放在 GLiNER2 前面做网页候选字段定位与统一输入，减少 DOM 噪声。', 'https://ferretlang.org/'),
              ('Match Data Studio 的工程实践会把“Samsung 65-inch 4K Smart TV QN65Q80C”拆成 brand、size、resolution、category、model number，再结合确定性规则、Embedding 和 LLM 做匹配确认；适合把 GLiNER2 抽出的品牌/型号/规格直接接到商品去重、实体匹配和低置信复核。', 'https://match-data.studio/blog/deterministic-vs-probabilistic-matching/'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'{url}\n')
          PY

            if git diff --quiet -- 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'; then
              exit 0
            fi

            git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'
            git commit -m 'b 追加本轮 GLiNER2 商品字段调研 0252'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
