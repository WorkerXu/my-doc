name: Append automatic review research

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message == 'chore: run automatic review research append'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append only new research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          article = Path('自动审查文章调研.md')
          history = Path('自动审查历史调研.md')

          entries = [
              ('GitHub 已把 Codex、Claude、Copilot 等 coding-agent session 直接显示到 Issues 与 Projects 表格/看板，并暴露 queued/working/waiting for review/completed 状态；适合把聚合审查 finding 变成项目项后直接观察 Codex 修复会话进度。', 'https://github.blog/changelog/2026-03-26-agent-activity-in-github-issues-and-projects/'),
              ('GitHub Projects 现可在项目看板侧边栏直接打开 agent session、查看日志并继续 steer；适合把多 Agent 审查结果发布成项目任务后，无需离开看板就继续驱动 Codex 修复和复审。', 'https://github.blog/changelog/2026-04-23-view-and-manage-agent-sessions-from-issues-and-projects/'),
              ('Mastra 已能把 Codex、Claude Code、Cursor 作为一等 subagent 编排，并保留各自文件/代码库推理、handoff 与权限能力；适合让 Codex 实现、独立 code reviewer、design reviewer 由同一外部 orchestrator 并行/串行协作。', 'https://mastra.ai/blog/introducing-sdk-subagents'),
              ('Mastra Dynamic Workflows 允许 Agent 在运行时用 JSON 组装由 agents、tools 和控制流构成的工作流且无需重新部署；适合按 PR 风险动态生成 plan-verifier→code-review→design-review→judge→publisher 审查图。', 'https://mastra.ai/blog/introducing-dynamic-workflows'),
              ('Mastra 的 code review bot 示例把仓库 coding standards 作为 workspace skill 注入 reviewer 并输出结构化 PR feedback；适合把已绑定 commit 的 plan/规则与 Figma 设计规范一起作为独立 reviewer 的可复用审查基线。', 'https://mastra.ai/blog/building-a-code-review-bot'),
              ('Codex 的计划持久化实现提案把 finalized Plan Mode 结果写入 `.codex/PLAN.md`，再让新上下文读取该文件实施；可在此基础上把该计划文件纳入 Git tree/哈希/trailer，稳定建立 plan artifact ↔ commit 绑定。', 'https://github.com/openai/codex/issues/15453'),
              ('Conventional Commits 规范允许机器可读 footer，且 footer 语法明确受 Git trailer 约定启发；可在现有 `feat/fix` 历史中统一加入 `Plan-File`、`Plan-Hash` 或 `Plan-Id`，让计划绑定既兼容团队提交规范又易被 CI 解析。', 'https://www.conventionalcommits.org/en/v1.0.0/?embedable=true'),
              ('figma-pilot 仅用少量 MCP 工具让 Codex 等 Agent 通过代码执行读取/批量检查 Figma 真实节点与设计系统，并提供 Codex skill；适合作为独立 design-review lane 的低上下文开销设计证据源。', 'https://github.com/youware-labs/figma-pilot'),
              ('Figma Edit MCP 可由 Codex 等支持 SKILL.md 的 Agent 读取/修改设计，并在执行前做引用与破坏性操作安全校验；适合作为可写 design-reviewer 的受约束设计通道，把审查修订留在真实 Figma 文件而非只输出文字。', 'https://github.com/neozhehan/figma-edit-mcp'),
              ('Codex Plan Mode 的最新源码调研梳理了 `<proposed_plan>`→`TurnItem::Plan`→同/新上下文实施的运行链路；适合在外部编排器中抓取稳定 plan artifact 后计算哈希并绑定后续 Git commit，而不是依赖普通聊天文本。', 'https://github.com/openai/codex/issues/38305'),
          ]

          article_text = article.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')
          history_set = {line.strip() for line in history_text.splitlines() if line.strip()}

          article_rows = []
          history_urls = []
          for reason, url in entries:
              if url not in article_text:
                  article_rows.append(f'| {reason} | {url} |')
              if url not in history_set:
                  history_urls.append(url)

          if article_rows:
              with article.open('a', encoding='utf-8') as f:
                  if article_text and not article_text.endswith('\n'):
                      f.write('\n')
                  f.write('\n'.join(article_rows) + '\n')

          if history_urls:
              with history.open('a', encoding='utf-8') as f:
                  if history_text and not history_text.endswith('\n'):
                      f.write('\n')
                  f.write('\n'.join(history_urls) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs: append new automatic review research'
            git push
          fi
