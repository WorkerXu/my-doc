name: Append auto review research c 20260826 r3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-auto-review-research-c-20260826-r3.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fq "$url" "$article" && ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append 'plan-sync 把计划、任务和 Agent session 状态直接保存在 Git 跟踪目录中，每次状态变更自动 pull/rebase、commit、push；适合把 Codex 的 plan/任务状态天然绑定到实际提交历史，并让多会话共享同一事实源。' 'https://github.com/datj9/plan-sync'
          append 'Checkpoint Thread 用 Codex Hooks 记录 task/goal 到具体改动的 provenance，验收后只提交归属于该目标的路径，并在 ship 报告中返回最终 commit SHA；适合把计划目标、修改范围与原子提交做可审计绑定。' 'https://github.com/JesseZhang97/checkpoint-thread'
          append 'Plan Orchestrator 以已审 Markdown playbook 为输入，每个条目独立 worktree 执行，之后让 Codex 与 Claude 对同一冻结证据包做双通道审查并确定性合并 findings；适合作为额外的多 Agent 复审编排层。' 'https://github.com/AysajanE/plan-orchestrator'
          append 'Agentplane 是 Git-native coding-agent 控制平面，把计划、变更文件、验证证据、review 状态和 PR 工件持久化到仓库内的 task/ACR 记录，并可驱动 Codex 等 Agent；适合作为计划到提交、审查与可追溯交付的统一控制层。' 'https://github.com/basilisk-labs/agentplane'
          append 'agentic-sdlc-pipeline 将 feature spec 与可选 Figma design tokens 送入 Planner→Coder→Tester→Reviewer→Deploy Gate 多 Agent 流程，Reviewer 会对照计划与约定审查并回环修复；适合作为“设计文件证据 + 独立代码审查”的参考实现。' 'https://github.com/harpalsinhJadav/agentic-sdlc-pipeline'
          append 'Figma Workflow Lab 展示通过 Figma MCP 在代码与 canvas 之间往返，把真实产品状态带回设计画布继续审查；适合把 Codex 产物回灌设计文件后再进行视觉/设计一致性复核。' 'https://www.figma.com/blog/workflow-lab-expanding-the-canvas-with-figma-mcp/'
          append 'Figma 官方 MCP Skills 提供分阶段的代码库/设计文件发现、设计系统生成与最终质量检查范式，可直接改造成设计 reviewer 的标准化多阶段审查流程，并在阶段间保留人工确认点。' 'https://help.figma.com/hc/en-us/articles/39166810751895-Figma-skills-for-MCP'
          append 'Fastio 给出了 Figma MCP 的多 Agent 设计审查链：设计抽取、代码生成、独立 reviewer 对照截图检查 spacing/color/component usage，再把 review notes 与 checklist 统一持久化；适合作为设计证据共享与复审编排参考。' 'https://fast.io/resources/mcp-server-for-figma/'
          append 'kanban-mcp 以仓库内 `.kanban/` 为事实源并通过 MCP 暴露 kanban_new/list/notes 等工具，文档给出 Codex CLI 的直接接入配置；适合把聚合后的审查 findings 由 Codex 写成可版本化的看板卡片和备注。' 'https://github.com/sifyfy/kanban-mcp'
          append 'Taskuary 提供面向 Codex/Claude/Gemini/Cursor/Copilot 的 Agent Kanban，卡片显示实时 session 与实际 Git 修改文件，并把结果进入 Review 队列等待批准；适合作为多 Agent 审查结果、人工决策和后续 Codex 任务的统一看板承载层。' 'https://github.com/ldbumble/taskuary'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research c 20260826 r3'
          git push
