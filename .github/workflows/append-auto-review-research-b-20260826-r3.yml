name: Append auto review research b 20260826 r3

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research-b-20260826-r3.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append 'Codex Planning Kit 把 PLANS.md 作为权威 ExecPlan 格式，并用 issue card、AGENTS.md 约束和验证命令把计划变成可审计仓库工件；适合在计划随代码提交后继续按同一计划基线复核实现。' 'https://github.com/EEstevanell/codex-planning-kit'
          append 'Durable Memory 示例要求在单个 commit 中同时生成 specs/prompt.md 与 specs/plan.md，直接提供“计划文件与一次 Git 提交原子绑定”的轻量实现模式。' 'https://gist.github.com/alvarobp/2607fa3a01e2b0b641c6eb8644e2dfe7'
          append 'coding-agent skill pack 将 plan artifact review、Codex PR/code review、审批状态和 review-loop supervisor 分开，并要求当前 PR head 的 GitHub-visible review 才能严格闭环；适合把计划、提交和独立 reviewer 串成可验证门禁。' 'https://github.com/kesslerio/coding-agent-openclaw-skill'
          append 'multi-agent-code-review 用 LangGraph orchestrator 动态选择 bug、安全、质量、测试 reviewer 并行审查，支持直接按指定 commit 运行和输出结构化汇总；适合作为 Codex 之外的独立多 Agent 复核层。' 'https://github.com/alanchn31/multi-agent-code-review'
          append 'AI Code Review Pipeline 会按依赖把大型 PR 分组，使用隔离、无工具 reviewer 读取精心裁剪的 diff/context，再产出可验证 findings；适合把计划与设计证据作为只读输入交给外部审查 Agent。' 'https://gist.github.com/vassvik/93711ec9f74c8c3fef914cb4989bbb55'
          append '该 2026-08 多 Agent review 模式让两个 reviewer 对同一固定 revision 独立取证、交换异议，再由第三个 writer 独占写权限；适合避免同源自审和并行改写冲突，并把 finding 明确绑定 commit SHA。' 'https://uygarduzgun.com/blog/tech/multi-agent-code-review-workflow'
          append 'cc-codex 通过 MCP 在 Claude Code 与 Codex 之间双向委派，Codex 负责 plan/spec/analyze，Claude 负责实现、测试和 Git 操作，并共享结构化上下文；适合作为跨模型 plan→实现→复审编排参考。' 'https://github.com/rachittshah/cc-codex'
          append '该 8-Agent Figma→代码流水线把 Design Analyst、Architect、Visual Reviewer、Quality Gate 分离，通过结构化工件交接并让独立 reviewer 对 Figma 做九维截图比较；非常适合作为设计文件驱动多 Agent code review 的工程范式。' 'https://www.kaelig.fr/design-system-components-with-ai-agent-teams/'
          append 'SmartUI 的 Agentic Figma-to-Code Visual QA 直接以 Figma frame 为 baseline，并通过 MCP 返回 pixel/layout/DOM/perceptual 差异及根因；适合作为代码 reviewer 之外的独立运行态视觉证据 lane。' 'https://www.testmuai.com/blog/agentic-figma-visual-qa/'
          append 'Browser Lens MCP 可让 Agent 读取真实页面 DOM/CSS/截图并执行 compare_with_figma、audit_ui、visual_qa，输出评分、差异和修复建议；适合在 Codex 实现后增加可操作的设计一致性复审。' 'https://github.com/nano-step/mcp-browser-lens'
          append 'Frontend Design Director 是 Codex 原生前端 review/QA 插件，带 no-ship gates、强制视觉迭代、Figma/product-design handoff 和结构化严重度审查；适合作为设计专门 reviewer 与代码审查结果汇总。' 'https://github.com/yappologistic/frontend-GOD'
          append 'Codex Channel Bridge 内置 Taskboard，并把 Codex 项目、threadId、Issue 状态、评论/附件和验收门禁绑定；适合把聚合 review findings 写回 Codex 可继续处理的看板任务并保留会话追踪。' 'https://github.com/lsiten/codex-channel-bridge'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research b 20260826 r3'
          git push
