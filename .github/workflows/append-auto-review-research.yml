name: Append auto review research

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append '用 5 个专门 reviewer 加 KISS reviewer 对 plan.md 分轮并行复核并迭代到全部通过，适合在 Codex 实施前把计划先过多 Agent gate，再把批准版本作为后续提交的审查基线。' 'https://gist.github.com/OmarElsebaey001/2c2bf1531c675404a8102b734012f22f'
          append '只读对抗式 plan reviewer 会逐项把计划假设对照真实代码验证，并专找遗漏、边界条件和不可行步骤；适合作为实现 Agent 之外的独立计划验真层。' 'https://github.com/ctxr-dev/agent-plan-reviewer'
          append '在计划进入批准或执行前即可调用 Codex 或 Claude 做外部复审，并把 reviewer/model 选择做成可重复工作流；适合固定“计划先审、通过再实现”的前置门禁。' 'https://github.com/dachev/plan-review'
          append '把 Codex 规划、Opus 复审、Sonnet swarm 实现拆成独立角色，并持久化 plan review/gate 状态；适合把已审计划作为多 Agent 实施与后续 commit review 的共同基线。' 'https://github.com/neonplants/auto-codex'
          append '把项目任务、验证 evidence、review findings 与人工 approval gate 持久化到同一开发 cockpit，且可用 Codex 自动化、Claude reviewer handoff；适合把聚合审查结果落成可继续处理的项目工件。' 'https://github.com/JoeSoep/ai-dev-team/blob/main/README.md'
          append '用共享 Specs、Kanban 与 MCP/ACP/A2A 编排多 Agent，并让 Review 卡片产出正式 verdict/findings；适合把 code/design reviewer 的结果直接沉淀到项目看板并驱动下一阶段。' 'https://github.com/phodal/routa'
          append 'CodeReview MCP 用结构化 issues_found、confidence、files_checked 等字段承载多步审查，并支持 images 作为视觉上下文；适合把代码 findings 与设计截图或视觉证据一起交给最终 judge 聚合。' 'https://github.com/BeehiveInnovations/zen-mcp-server/blob/main/docs/tools/codereview.md'
          append '把 Figma 节点、布局、样式、图片和 SVG 转成面向 coding agent 的结构化设计数据，适合给独立 design-reviewer 提供真实设计文件证据，再与代码 reviewer 结果交叉核对。' 'https://github.com/felixAnhalt/figma-to-code-mcp'
          append '同时支持 Codex、Gemini 等后端、多 Agent 共识和任务 DAG，并用 Git Notes 把 Agent 会话检查点附着到具体 commit；适合把 plan 任务、审查裁决和提交证据串成可追踪链路，再从 TUI 查看状态。' 'https://github.com/ZhangHanDong/agent-teams-rs'
          append '把磁盘中的 Agent plan 转成带依赖、Ready 状态和关键路径的实时 Kanban，同时保留 plan 文件为持久化真源；适合把 Codex 计划与审查 finding 映射到可持续推进的看板。' 'https://github.com/OthmanAdi/plandeck'
          append '基于运行中的 UI 截图与仓库自身 design system 做有依据的视觉审查，并过滤无法定位证据的 finding；适合作为设计文件审查之外的独立视觉 reviewer。' 'https://github.com/apatureai/verdict'
          append 'GitHub Action/App 在隔离 sandbox 中运行不可信 PR 并审查 preview deploy；适合把运行时设计验证作为代码 reviewer 之外的独立 gate，并让结果继续绑定 PR 与 commit。' 'https://github.com/apatureai/gate'
          append '点选真实网页元素生成 UI 修复任务，再由 coding agent 修改并用前后截图验证；适合把设计审查从抽象描述变成可定位、可复验的视觉 evidence。' 'https://github.com/SpaceParrots/nit'
          append '多 provider GitHub Action 统一生成 PR 摘要、逐行 findings 和可选 merge-blocking checks；适合作为 Codex 之外的交叉 reviewer 路由层，并把最终结果落到 GitHub review/checks。' 'https://github.com/777genius/review-router'
          append '其 multi-ai 流程在 plan 阶段并行专家审查并加 Codex gate，代码阶段再走 Sonnet、Opus、Codex 级联复审；适合直接借鉴异构多 Agent plan/code review 编排。' 'https://github.com/aihip/android-claude-code-skills'
          append '把 Codex agent 嵌入 Figma 并通过本地 bridge 直接操作真实画布；适合让 design reviewer 与代码 Agent 共享同一设计文件上下文，并把审查发现回到设计侧复核。' 'https://github.com/AlbertoHugonin/codex-canvas-for-figma'
          append '给网页叠加 Figma 风格的 pin-and-comment 反馈层，并可把导出的结构化反馈直接交给 coding agent；适合把设计审查意见转成可追踪的修复输入。' 'https://github.com/brijeshp/pinflow'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research'
          git push