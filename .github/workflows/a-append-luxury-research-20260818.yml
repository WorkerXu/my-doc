name: a append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/a-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append a luxury research rows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('Galileo Protocol 的腕表 DPP 官方 JSON Schema 把 manufacturer referenceNumber 与 serialNumber、GTIN、caliber 等字段明确分层，并给出奢侈腕表示例；可直接借鉴为三源 canonical identity 数据模型，先判定编号角色再做 reference 严格等值，避免把平台 SKU、单表流水号或机芯号误当同款键。', 'https://www.galileoprotocol.io/specifications/schemas/dpp/dpp-watch.schema'),
              ('GS1 的 Verified by GS1 官方说明把产品身份校验定义为确认“是不是你认为的那个产品”，并依赖全球唯一、可验证的 GTIN；腕表若能从来源补到 GTIN，可把它作为 reference 之外的强一致性或冲突证据，且对不存在或无法验证的标识符应拒绝猜测。', 'https://support.gs1.org/support/solutions/articles/43000734077-what-is-verified-by-gs1-'),
              ('Longines 官方真伪证书申请页把 Watch reference 与 Serial Number 分成两个独立字段，并给出 L2.320.0.87.6 这类 reference 格式示例；非常适合建立“型号级 reference ≠ 单表 serial”的字段角色规则，并指导标题、保卡和图片 OCR 的格式校验。', 'https://www.longines.com/en-us/contact/certificate-of-authenticity'),
              ('该研究把 LLM 实体匹配拆成匹配或不匹配 token、关键属性判断、实体级决策三个显式阶段，并用支持与反对论证提升稳健性；可用于 reference 抽取后的疑难候选做可解释冲突审计，但自动合并仍只允许 canonical reference 严格一致。', 'https://arxiv.org/abs/2511.22832'),
              ('ACL 2026 的 DySECT 用持续扩张的知识库、概率知识和图推理反哺信息抽取器，形成随使用不断更新的闭环；适合三来源持续增量时沉淀品牌 reference 词典、别名和新格式，再用人工复核结果迭代抽取器，而不改变 precision-first 的硬匹配门槛。', 'https://aclanthology.org/2026.acl-demo.69/'),
              ('ACL 2026 对数值和字母数字实体抽取做了系统误差诊断，显示编码式表达和字符级表达仍是 LLM 的稳定失败点，并验证 Error-Aware prompting 可改善抽取；腕表 reference 常是一位字符即决定不同型号，可据此加入字符级复核、格式词典和不稳定即拒识策略。', 'https://aclanthology.org/2026.acl-industry.132/'),
              ('这篇 2026 年 Merchant Center 数据 Feed 实践把 brand、GTIN、MPN 单列为唯一产品标识符，并区分主 Feed 与补充 Feed；可借鉴为三源增量数据设计“原始来源字段 + 规范化 reference 或标识符补充层”，避免覆盖原证据，同时把后续纠错作为可追踪补充数据。', 'https://zhuanlan.zhihu.com/p/2000249156971823722'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY

            if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
              exit 0
            fi

            git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
            git commit -m 'a 追加本轮奢侈品文章调研'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1