name: a-append-luxury-research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-append-luxury-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix table line breaks
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          target = Path('奢侈品文章调研.md')
          s = target.read_text(encoding='utf-8')
          old = 'https://github.com/JohannesBuchner/imagehash || 2026 年千万级'
          new = 'https://github.com/JohannesBuchner/imagehash |\n| 2026 年千万级'
          if old in s:
              s = s.replace(old, new, 1)
              target.write_text(s, encoding='utf-8')

          history = Path('奢侈品文章历史调研.md')
          h = history.read_text(encoding='utf-8')
          old_h = 'https://github.com/JohannesBuchner/imagehash || https://injoit.org/index.php/j1/article/view/2468'
          new_h = 'https://github.com/JohannesBuchner/imagehash |\n| https://injoit.org/index.php/j1/article/view/2468'
          if old_h in h:
              h = h.replace(old_h, new_h, 1)
              history.write_text(h, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            git add -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'
            git commit -m '修正奢侈品调研表格换行'
            git push origin HEAD:main
          fi
