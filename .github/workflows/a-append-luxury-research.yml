name: a-append-luxury-research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-append-luxury-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append deduplicated luxury research
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          target='奢侈品文章调研.md'
          history='奢侈品文章历史调研.md'
          append_pair() {
            local url="$1"
            local row="$2"
            if ! grep -Fq -- "$url" "$target"; then
              printf '%s\n' "$row" >> "$target"
            fi
            if ! grep -Fq -- "$url" "$history"; then
              printf '| %s |\n' "$url" >> "$history"
            fi
          }
          append_pair 'https://injoit.org/index.php/j1/article/view/2468' '| 2026 年千万级 B2B 商品目录研究直接指出 dense embedding 会平滑数字与精确标识符，导致 SKU/model number 的离散差异被语义相似度掩盖；其实体化 anchor 检索把品牌、型号、规格显式拆出，非常适合腕表先做 brand+canonical reference 精确召回，再让向量只补候选。 | https://injoit.org/index.php/j1/article/view/2468 |'
          append_pair 'https://arxiv.org/abs/2605.00353' '| IKEA 2026 年生产级商品检索研究系统构造属性级、类目级和多属性 hard negatives，并强调训练数据质量优先于单纯扩量；可把同品牌同系列但 reference 仅差一位的腕表批量挖成困难负例，专门压低“看起来很像但不是同款”的 false positive。 | https://arxiv.org/abs/2605.00353 |'
          append_pair 'https://doi.org/10.14778/3811243.3811251' '| ALER 是 2026 年 PVLDB 的主动学习实体解析系统，目标正是减少昂贵标注并避免传统 AL 反复重训带来的扩展瓶颈；适合只有几百对黄金样本时优先挑选 reference 边界最不确定、最容易误合并的候选给人工标注，再迭代高精度 matcher。 | https://doi.org/10.14778/3811243.3811251 |'
          append_pair 'https://link.springer.com/chapter/10.1007/978-3-031-77429-4_58' '| 该开放论文专门从二手汽车零部件图片读取印刷 part number，并显示针对非自然语言字母数字串微调的开源 OCR 可优于通用云服务；可直接迁移到表背、保卡、吊牌的 reference 识别，并用字符扰动增强 O/0、I/1 等高风险误读样本。 | https://link.springer.com/chapter/10.1007/978-3-031-77429-4_58 |'
          append_pair 'https://openreview.net/forum?id=NgMbGDCmAM' '| 该方法把实体匹配转成语言模型驱动的 community detection，并在商品数据库去重任务上强调近线性扩展与跨匹配关系的一致性约束；适合把三源候选先形成小图，再用全局一致性阻止 pairwise 判断互相矛盾，reference 冲突仍作为硬 cannot-link。 | https://openreview.net/forum?id=NgMbGDCmAM |'
          append_pair 'https://www.sciencedirect.com/science/article/pii/S0020025526007322' '| X-TREATS 面向持续到达数据的 streaming entity resolution，把匹配分数、解释信号和增量处理结合，并在实验中保持高 matching precision；与三源商品不断新增高度一致，可把每次新商品只和受影响候选比较，同时保留可审计证据，低可信结果不污染既有 reference 簇。 | https://www.sciencedirect.com/science/article/pii/S0020025526007322 |'
          append_pair 'https://aclanthology.org/2026.acl-industry.101/' '| SGER 采用“先学习结构解析、再学习实体匹配”的两阶段课程，在 5 万真实测试对上取得很高精度并已用于大规模生产；虽然论文处理姓名，但其结构先验思路可迁移到腕表，把品牌、reference 格式、编号角色先解析清楚，再做二元匹配以减少脏文本误判。 | https://aclanthology.org/2026.acl-industry.101/ |'
          append_pair 'https://aclanthology.org/2025.naacl-industry.2/' '| RTSM 用多种监督信号蒸馏低延迟电商语义匹配模型，训练信号包含人工审计、合成难例、行为和类目信号；可借鉴为千万级候选召回/轻量复核层，把高成本模型知识压到小模型，同时保留 reference exact/veto 作为最终自动合并门槛。 | https://aclanthology.org/2025.naacl-industry.2/ |'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "$target" "$history"; then
            git add -- "$target" "$history"
            git commit -m '追加奢侈品文章调研'
            git push origin HEAD:main
          fi
