name: c append luxury research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append deduplicated research rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/append_luxury_research.py <<'PY'
          from pathlib import Path

          items = [
              ('Khoji 提供文本、图像及混合模态检索的 LoRA 微调与迭代 hard-negative mining，并直接带跨品牌 SKU matching 示例；可用同品牌相邻 reference、外观极近但型号不同的腕表作为困难负例，把百万级候选召回器专门训练成“先找全、但不把相似当相同”，最终仍由 reference 硬规则收口。', 'https://github.com/suyashh94/khoji'),
              ('Samesake 把电商搜索与实体解析放在同一工程框架中，支持 structured parse gates、分通道打分、可解释结果以及 confirm/decline 后的别名学习；很适合把 brand/reference 设为不可被语义相似度覆盖的硬门槛，同时保留标题、图片和别名作候选召回与人工复核辅助。', 'https://github.com/asyncdotengineering/samesake'),
              ('SERF 是持续迭代的语义实体解析框架，包含 FAISS blocking、块级匹配、合并和评测闭环，并可多轮运行直至稳定；可借其“候选生成与匹配解耦”的工程结构处理三源持续增量，但在本需求中应把 LLM 合并权限降级，只允许 canonical reference 一致时自动归并。', 'https://github.com/Graphlet-AI/serf'),
              ('Abstain-R1 专门学习校准后的拒答/拒识行为，并在不可判定输入上主动 abstain；可迁移到 precision-first 商品匹配，把 reference 缺失、OCR 字符不确定、品牌冲突或多候选并列等情况训练为明确“不自动匹配”，而不是被迫二分类产生 false positive。', 'https://aclanthology.org/2026.findings-acl.985/'),
              ('这项多模态 LLM OCR 研究直接分析图像分辨率与视觉复杂度对字符级准确率的影响，结论强调精确字符任务对输入质量高度敏感；腕表 reference 常刻在表背且字母数字只差一位即可变成另一型号，可据此设置最小像素/清晰度门槛，达不到就拒识而非猜号。', 'https://arxiv.org/abs/2503.23667'),
              ('该研究比较多模态 LLM 的直接 OCR 与 OCR post-correction，并显示后校正可显著改善转录；可在表背、保卡、吊牌 reference 提取中采用“双路 OCR + 受限候选库校正”，但仅当原始字符证据与品牌 reference 词典一致时放行，避免自由生成型号。', 'https://arxiv.org/abs/2504.00414'),
              ('Breitling 官方 FAQ 明确说明 reference number 唯一标识一个腕表型号及其设计、机芯和特征，并指出 reference 可从保修资料或表背获得；这是与本需求定义高度一致的品牌一手证据，可用于制定“型号级 reference 与单表 serial number 分离”的字段规范和图像 OCR 取证位置。', 'https://www.breitling.com/us-en/service/faq/'),
              ('阳采集团的工业品 AI 数据治理实践采用规则引擎加大模型，从混乱商品字段中拆解品牌、型号等关键属性，并针对“一物多码”做消歧；与三源二奢数据的字段稀疏、命名不统一场景同构，可借鉴品牌词典、型号结构化抽取和规则优先的治理分层。', 'https://zhuanlan.zhihu.com/p/1942151146182545569'),
              ('零售领域的 Visual RAG 用少量样本即可做细粒度商品 ID 识别，新商品只需加入少量示例而无需重训；很适合持续增量腕表从图片补充 reference/型号候选，但视觉结果只作召回和旁证，最终仍由 canonical reference 严格验证。', 'https://openaccess.thecvf.com/content/CVPR2025W/FGVC/html/Lamm_A_Visual_RAG_Pipeline_for_Few-Shot_Fine-Grained_Product_Classification_CVPRW_2025_paper.html'),
              ('面向电商商品属性预测，以小规模标注配合大量未标注 listing、PEFT 与 DPO 提升紧凑多模态模型；适合只有几百对黄金标签时训练图片侧属性/reference 辅助抽取器，输出仍应经标题、OCR 或品牌型号库复核后才参与匹配。', 'https://openaccess.thecvf.com/content/ICCV2025W/CDEL/html/Kulkarni_Efficient_Learning_for_Product_Attributes_with_Compact_Multimodal_Models_ICCVW_2025_paper.html'),
              ('Amazon 的商品图像分析研究专门区分“图片真实证据”与模型潜在知识，并提供面向 catalog 术语的属性预测基准；可用于约束图片侧 reference/型号证据必须可从图像支持，避免 VLM 凭先验猜号，证据不足时直接拒识。', 'https://openaccess.thecvf.com/content/WACV2025W/PRAW/html/Trabelsi_What_Matters_when_Building_Vision_Language_Models_for_Product_Image_WACVW_2025_paper.html'),
              ('DiT-Distill 针对 open-set 细粒度检索，重点学习属性级微小差异并泛化到训练中未见的子类别；适合新增腕表 reference 的图片候选召回和同系列近邻 hard-negative 挖掘，但最终身份仍必须回到品牌内 canonical reference exact gate。', 'https://openaccess.thecvf.com/content/CVPR2026/html/Jiang_DiT-Distill_Open-Set_Fine-Grained_Retrieval_via_Generative_Curriculum_Knowledge_CVPR_2026_paper.html'),
              ('该工作直接研究“误判代价很高时何时拒绝预测”，并为 reject-option 分类设计校准损失；可把跨源“同 reference”判定做成高精度接受区，标题/OCR 噪声或边界候选落入拒识区，宁可降低覆盖也不制造 false positive。', 'https://proceedings.mlr.press/v260/shah25a.html'),
              ('将选择性分类与 OOD 检测统一，并以零样本方式组合多个检测器、控制最坏情形拒识风险；适合新品牌、新来源和持续增量引起的分布漂移，在 matcher 面对陌生 reference 分布时优先 abstain，避免过度自信误合并。', 'https://proceedings.mlr.press/v286/dadalto-camara-gomes25a.html'),
          ]

          research = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')

          research_text = research.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')
          if not research_text.endswith('\n'):
              research_text += '\n'
          if not history_text.endswith('\n'):
              history_text += '\n'

          for reason, url in items:
              if url in history_text:
                  continue
              if url not in research_text:
                  research_text += f'| {reason} | {url} |\n'
              history_text += f'| {url} |\n'

          research.write_text(research_text, encoding='utf-8')
          history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/append_luxury_research.py
            git diff --check
            git add -- "奢侈品文章调研.md" "奢侈品文章历史调研.md"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "research(c): append new luxury reference matching sources"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
