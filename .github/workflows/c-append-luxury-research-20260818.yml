name: c append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append c luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('直接面向二手电商的商品结构化瓶颈，先从非结构化商品元数据学习领域语义，再生成可用于下游任务的 semantic codes；适合三源字段稀疏、长尾 reference 场景做统一结构化表征和候选召回，但自动合并仍只由已验证 canonical reference 精确一致决定。', 'https://aclanthology.org/2025.emnlp-industry.78/'),
              ('淘宝拍立淘 2026 生产级原生多模态搜索基座，把图片、文本和混合意图统一到 HybSID 与持续预训练检索框架；可作为千万级腕表图文候选召回和持续增量索引参考，视觉或语义结果只进入 reference/OCR 严格校验层。', 'https://arxiv.org/abs/2607.17499'),
              ('2026 年 BlockingPy 用 schema-agnostic 的近似最近邻与图算法显著减少实体解析比较量，并支持 CPU/GPU；适合 100万–1000万级三源记录先做高召回 blocking，再在小候选集内执行品牌加 canonical reference 硬校验，避免全量笛卡尔积。', 'https://www.sciencedirect.com/science/article/pii/S2352711026000774'),
              ('这个新开源 ER 工程直接为产品实现多键 blocking、SKU/品牌 hard conflict、manual/auto/no-match、拒绝记忆、provenance 与 anti-transitive union；尤其适合把“同 SKU 不同品牌或关键标识冲突即硬否决”和传递合并前冲突检查落成 precision-first 防误合并机制。', 'https://github.com/sergey-lastochkin/master-data-resolution'),
              ('2026 大规模电商 VLM 适配研究专门覆盖多图、噪声和 attribute-centric 商品数据，并评测动态属性抽取；适合表盘、表背、保卡等多图联合恢复品牌与 reference 候选，补齐稀疏字段，但候选必须再经过品牌型号词典和 exact gate 验证。', 'https://arxiv.org/abs/2602.11733'),
              ('实务型商品匹配流程明确把 brand+normalized MPN 视为 decisive signal，并用关键规格冲突 veto、分层 blocking 和传递错误防护；与腕表“品牌作用域内 reference 为身份键、冲突即拒绝、文本和图片仅辅助”的规则设计高度一致。', 'https://www.anglera.com/glossary/product-matching'),
              ('1688 图搜同款方案展示大规模动态商品库的深度视觉特征检索与类目/属性抽取，适合作为 reference 缺失时的图片候选召回工程参考；但视觉同款只能产生候选，最终仍需品牌加 canonical reference 严格一致才能自动归并。', 'https://zhuanlan.zhihu.com/p/2036109515855287978'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'c 追加本轮奢侈品文章调研'
          git push
