name: c append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append c luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('系统评估大语言模型做实体匹配的 zero-shot/few-shot 能力与提示策略，可作为 reference 硬规则之后的疑难候选二阶段复核器；对本需求更适合把模型限定为“解释冲突与辅助拒识”，而不是让语义相似度越过型号严格一致条件。', 'https://arxiv.org/abs/2310.11244'),
              ('直接研究跨电商网站的 product record linkage，并用“候选正对 + 与其冲突的关联对”组成组置信度进行半监督自训练；只需少量标注即可利用三源之间的冲突关系，特别适合把不满足一对一/同 reference 一致性的候选降权或拒绝。', 'https://aclanthology.org/C14-1124/'),
              ('面向比价场景的持续流式商品归一化，利用有限且有噪声的唯一标识监督在线学习，并指出 complete-link 聚类能抑制 single-link 的链式误合并；与持续增量、precision-first 的腕表跨源聚类非常契合。', 'https://www.microsoft.com/en-us/research/publication/adaptive-product-normalization-using-online-learning-for-record-linkage-in-comparison-shopping/'),
              ('MWPD 电商商品匹配方案显式从原始商品信息补抽 brand 与 model，并用 Part Number 等字段构建 model 词表，再将 brand、model、title、price 输入多模型判别；可直接参考“先从标题恢复 reference/model，再进入候选匹配”的工程分层。', 'https://ir-ischool-uos.github.io/mwpd/MWPD20/paper4.pdf'),
              ('把实体匹配歧义从简单二分类扩展为关系发现，适合先区分 exact same、相近变体、相关但不同等关系；腕表中同系列外观极近但 reference 不同，可用关系层做明确的冲突标签，最终仅 exact-same-reference 进入自动合并。', 'https://arxiv.org/abs/2403.17344'),
              ('从实操角度展示精确等价 blocking、相似度阈值与 precision/recall 取舍，并进一步讨论多源实体聚类；可借鉴为“高阈值自动合并 + 低置信度不匹配/人工复核”的可解释基线，符合宁可漏匹配也不能错配。', 'https://zhuanlan.zhihu.com/p/2000811473736311645'),
              ('给出 OCR 在型号编号等固定词汇场景的自定义字典与“exact first、fuzzy fallback”校正思路；腕表 reference 若只出现在表背、保卡或吊牌图片中，可先 OCR 再对品牌 reference 白名单做严格校验，将视觉证据转成可审计的型号字符串。', 'https://zhuanlan.zhihu.com/p/2044354359304226501'),
              ('针对商品实体解析把文本信息与商品上下文图表示结合，在无监督条件下生成候选排名；可作为百万级数据的辅助召回/候选排序信号，尤其适合字段稀疏时利用品牌、价格等共享上下文，但最终自动合并仍由 reference 硬证据收口。', 'https://sigir-ecom.github.io/ecom2019/ecom19Papers/paper26.pdf'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'c 追加本轮奢侈品文章调研'
          git push
