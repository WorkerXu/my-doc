name: c append luxury research 20260818

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append deduplicated research rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/append_luxury_research.py <<'PY'
          from pathlib import Path

          items = [
              ('面向真实电商的生成式属性值抽取，覆盖 2,000 个品类、1,000+ 属性和多语言文本，并用 LLM 扩充训练数据；可把 reference/model number 作为高精度专用属性，从稀疏标题中抽候选，再由品牌内 canonical reference exact gate 校验，适合少量黄金标签扩充训练。', 'https://aclanthology.org/2025.knowledgenlp-1.6/'),
              ('京东 2026 年生产级多模态商品表示用一套 MLLM 同时对齐多种协同信号并生成多路商品表征；可作为千万级标题+图片候选召回/排序层，补足字段稀疏，但表征相似只缩小候选，最终同款仍由已验证 reference 严格一致裁决。', 'https://arxiv.org/abs/2607.11030'),
              ('UCP Catalog Lookup 把标识符解析明确区分 exact 与 featured，并要求多标识指向同一商品时去重、SKU 等次级标识必须可回溯到商品/变体；很适合设计 reference 身份层：只把“直接解析到具体变体”的强标识视为自动同款证据，模糊/父级解析不得越权。', 'https://ucp.dev/2026-04-08/specification/catalog/lookup/'),
              ('百度电商商品理解实践把 SPU、品牌/子品牌、类目、系列、型号、版本和属性拆成细粒度结构，并结合多模态与知识图谱；适合三来源先统一品牌/系列/型号语义，再从标题和图片恢复 reference 候选，最终仍由 canonical reference 硬校验收口。', 'https://zhuanlan.zhihu.com/p/1900664815246086830'),
          ]

          research = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')

          research_text = research.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')
          if not research_text.endswith('\n'):
              research_text += '\n'
          if not history_text.endswith('\n'):
              history_text += '\n'

          for reason, url in items:
              if url in history_text:
                  continue
              if url not in research_text:
                  research_text += f'| {reason} | {url} |\n'
              history_text += f'| {url} |\n'

          research.write_text(research_text, encoding='utf-8')
          history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/append_luxury_research.py
            git diff --check
            git add -- "奢侈品文章调研.md" "奢侈品文章历史调研.md"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "追加 c 本轮奢侈品文章调研"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
