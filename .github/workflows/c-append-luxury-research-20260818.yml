name: c append luxury research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append deduplicated research rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/append_luxury_research.py <<'PY'
          from pathlib import Path

          items = [
              ('直接在 24 个电商站点的异构相机规格上采用“品牌→型号”两阶段 Blocking；当 model 字段缺失或含糊时从 page title 规则抽取型号，并用 block splitting 明显提升 precision，和“reference 埋在标题、千万级候选压缩、宁漏勿错”的腕表场景高度同构。', 'https://ceur-ws.org/Vol-2726/paper5.pdf'),
              ('直接研究从电商商品标题联合抽取属性和值，示例把字母数字串 b34308 正确识别为 model number；生成式/位置式方案可用于从噪声标题定位 reference，再配合品牌词典和格式规则做严格规范化与拒识。', 'https://arxiv.org/abs/2208.07130'),
              ('JPAVE 针对同一商品在不同购物平台上描述结构和风格不同的问题，同时支持开放世界新属性值；其 copy mechanism 只聚焦输入中的相关片段，适合持续增量时抽取此前未见的 reference，而不是把未知型号强行映射到旧型号。', 'https://arxiv.org/abs/2311.04196'),
              ('电商检索工程中用当前模型自身的 Top-K 误召回自动挖掘 hard negatives，并明确排除已知正例；可把同品牌、同系列、只差 1–2 位字符的相邻 reference 作为困难负例持续回灌，专门压低最危险的 false positive。', 'https://qdrant.tech/articles/sparse-embeddings-ecommerce-part-3/'),
              ('生产级多模态电商方案面对文本元数据稀疏/不可靠和视觉差异，通过按细分类目检索 few-shot exemplars 做校准，并已扩展到每日数百万 listing；可借鉴其“类目内检索+校准上下文”给 reference 抽取/复核提供高相关样例，减少跨类目或长尾误判。', 'https://aclanthology.org/2026.acl-industry.41/'),
              ('电商 NER 实践把品牌、型号、系列等作为独立实体类别，并利用实体重要性参与精确召回；可把标题中的 reference 当成高权重“型号”实体先抽取，再在 canonical brand 内做严格等值匹配，避免营销词和低价值修饰词干扰。', 'https://zhuanlan.zhihu.com/p/383937575'),
          ]

          research = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')

          research_text = research.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')
          if not research_text.endswith('\n'):
              research_text += '\n'
          if not history_text.endswith('\n'):
              history_text += '\n'

          for reason, url in items:
              if url in history_text:
                  continue
              if url not in research_text:
                  research_text += f'| {reason} | {url} |\n'
              history_text += f'| {url} |\n'

          research.write_text(research_text, encoding='utf-8')
          history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/append_luxury_research.py
            git diff --check
            git add -- "奢侈品文章调研.md" "奢侈品文章历史调研.md"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "research(c): append new luxury reference matching sources"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
