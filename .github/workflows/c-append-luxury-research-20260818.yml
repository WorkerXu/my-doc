name: c append luxury research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append deduplicated research rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/append_luxury_research.py <<'PY'
          from pathlib import Path

          items = [
              ('Progressive Entity Resolution 将大规模 ER 拆成过滤、加权、调度、匹配四步并按收益逐步处理；适合 100万–1000万持续增量数据优先处理 brand+reference 强证据候选，把昂贵验证留给少量疑难项，同时允许未决记录不强行归并。', 'https://arxiv.org/abs/2503.08298'),
              ('DynaHash 针对流式 record linkage 用 MinHash 表示 blocking key，再以 Hamming LSH 建候选结构，并给出次线性处理能力；适合持续新增商品只更新候选索引，先高召回缩小比较范围，最终仍由品牌作用域内 canonical reference exact gate 放行。', 'https://www.sciencedirect.com/science/article/pii/S0306437926000062'),
              ('ALT/FNDATA 的腕表拍卖数据同时提供品牌、model、reference、图片和原始 lot URL，可作为独立的 reference 弱监督语料与外部核验源；特别适合从真实标题学习 reference 抽取格式，并按同品牌相邻 reference 自动构造高风险 hard negatives。', 'https://docs.altfndata.com/'),
              ('2026 年 Omega reference 指南把 14 位六段式 PIC 拆成系列、材质、尺寸、机芯、盘面和序列段；可直接做品牌专属 parser/canonicalizer，在只差一段的近邻型号间设置硬冲突，避免把同系列视觉近似款误并。', 'https://hrockluxury.com/blogs/journal/omega-reference-number-guide-aqua-terra-teak'),
              ('Minun 是面向实体匹配的模型无关反事实解释工具，可定位“哪些字段变化会让匹配结论翻转”；适合在几百对黄金标签上审计 false positive，验证 matcher 是否真正依赖 reference，而不是被标题或图片相似度带偏，并据此固化 veto 规则。', 'https://github.com/megagonlabs/minun'),
              ('这篇欧米茄型号编码资料展示新旧 reference 的品牌专属分段规则及各段含义，可补充中文二手标题中的型号解析词典；对点号、分段、位数等格式做保守规范化后再 exact match，能减少把尺寸、机芯号或截断短号当完整 reference 的风险。', 'https://zhuanlan.zhihu.com/p/114978925'),
          ]

          research = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')

          research_text = research.read_text(encoding='utf-8')
          if not research_text.endswith('\n'):
              research_text += '\n'
          for reason, url in items:
              if url not in research_text:
                  research_text += f'| {reason} | {url} |\n'
          research.write_text(research_text, encoding='utf-8')

          history_text = history.read_text(encoding='utf-8')
          if not history_text.endswith('\n'):
              history_text += '\n'
          for _, url in items:
              if url not in history_text:
                  history_text += f'| {url} |\n'
          history.write_text(history_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python /tmp/append_luxury_research.py
            git diff --check
            git add -- "奢侈品文章调研.md" "奢侈品文章历史调研.md"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "research(c): append new luxury reference matching sources"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
