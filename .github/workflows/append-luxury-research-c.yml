name: Append luxury research c

on:
  push:
    paths:
      - '.github/workflows/append-luxury-research-c.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append new non-duplicate research
        run: |
          python - <<'PY'
          from pathlib import Path

          research_path = Path('奢侈品文章调研.md')
          history_path = Path('奢侈品文章历史调研.md')

          items = [
              (
                  '直接在 WDC 的 watches 等商品匹配数据上同时优化二元实体匹配与 GTIN/MPN 实体 ID 预测，并用 token 级 attention 强化关键编号；可把 reference 作为辅助身份目标，让模型优先关注型号 token，但最终自动放行仍只接受规范化 reference 严格一致。',
                  'https://www.openproceedings.org/2024/conf/edbt/paper-76.pdf',
              ),
              (
                  'Walmart 的生产级属性抽取方案通过学习不同 LLM 的集成权重提升属性值准确性；可用于对标题中的 reference 做多模型抽取与一致性投票，只有多个抽取器对 canonical reference 达成一致才进入自动匹配，从而压低单模型幻觉造成的误合并。',
                  'https://arxiv.org/abs/2403.00863',
              ),
              (
                  '2026 年多模态电商属性抽取方法通过动态缩小当前商品的候选属性范围来减少错误预测，并只融合与文本语义相关的图像区域；可将品牌/系列下的 reference 候选空间做受限预测，降低自由生成错误型号，图片只在标题稀疏时辅助核验。',
                  'https://www.mdpi.com/2079-9292/15/5/969',
              ),
              (
                  '真实电商生产方案把文本与图片联合用于大规模属性生成，支持 zero-shot、文本缺失值预测和 distant supervision，并以 recall@90P 衡量高精度区间；适合借鉴“高 precision 阈值 + 弱监督”训练 reference 抽取器，用图片补足稀疏字段而不越过 reference 硬规则。',
                  'https://arxiv.org/abs/2306.00379',
              ),
              (
                  'Shopee 已部署的多图片+文本 item embedding 可把多张商品图和标题压成统一语义表示，并减少纯视觉检索因包装/纹理相似导致的错误召回；适合作为千万级候选召回和视觉冲突检测层，再由 reference exact gate 决定是否真正合并。',
                  'https://ojs.aaai.org/index.php/AAAI/article/view/30311',
              ),
              (
                  '腕表专用图片识别工具可从照片推断品牌、型号与 reference，并明确给出置信度且建议用 reference lookup 做最终交叉核验；非常适合作为图片辅助证据和人工复核入口，其对 exact reference 可能不准的限制也支持“视觉不能单独触发自动合并”。',
                  'https://thewatchinfo.com/identify',
              ),
              (
                  '工业品同品识别案例把属性抽取、跨来源同品识别和大规模 SKU 管理放在同一闭环，并强调从非结构化描述抽取品牌、型号等关键字段；可借鉴其工程分层先结构化再比对，但二奢腕表应把 reference 严格一致作为最终硬门槛。',
                  'https://zhuanlan.zhihu.com/p/1937142756318355556',
              ),
          ]

          research = research_path.read_text(encoding='utf-8')
          history = history_path.read_text(encoding='utf-8')
          changed = False

          for reason, url in items:
              if url in history or url in research:
                  continue
              if not research.endswith('\n'):
                  research += '\n'
              research += f'| {reason} | {url} |\n'
              if not history.endswith('\n'):
                  history += '\n'
              history += f'| {url} |\n'
              changed = True

          if changed:
              research_path.write_text(research, encoding='utf-8')
              history_path.write_text(history, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'docs: append fresh luxury matching research'
          git push
