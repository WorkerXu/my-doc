name: Append AI sharing history f 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-history-f-20260827.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append researched URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          history = Path('ai分享历史调研.md')
          urls = [
              'https://www.youtube.com/watch?v=wgOCzHXKw4c',
              'https://www.youtube.com/watch?v=M30gp1315Y4',
              'https://www.youtube.com/watch?v=BM39OouLNsM',
              'https://www.youtube.com/watch?v=oMjacYfwYyA',
              'https://www.youtube.com/watch?v=PIdETjcXNIk',
              'https://www.youtube.com/watch?v=g7aeVaUs9DU',
          ]

          text = history.read_text(encoding='utf-8')
          added = []
          for url in urls:
              if url in text:
                  continue
              if text and not text.endswith('\n'):
                  text += '\n'
              text += f'| {url} |\n'
              added.append(url)

          if added:
              history.write_text(text, encoding='utf-8')
              print(f'added {len(added)} urls')
          else:
              print('no new urls')
          PY

      - name: Commit history update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'ai分享历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'ai分享历史调研.md'
          git commit -m 'docs: append ai sharing history f 20260827'
          git push
