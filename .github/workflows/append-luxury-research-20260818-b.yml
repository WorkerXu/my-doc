name: Append luxury research 20260818 b

on:
  push:
    paths:
      - '.github/workflows/append-luxury-research-20260818-b.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research only
        shell: bash
        run: |
          printf '\n' >> '奢侈品文章调研.md'
          cat <<'EOF' >> '奢侈品文章调研.md'
          | 用 set-similarity join 做 hands-off blocking，并允许直接约束候选 pair budget、召回与运行时权衡；适合千万级三源数据先按品牌和 reference token 压缩候选，再把最终自动合并严格收口到规范化 reference 一致，避免全量笛卡尔积。 | https://arxiv.org/abs/2312.15835 |
          | 提供面向超大表的三阶段实体匹配流水线：blocking、FAISS 近邻候选生成、模糊评分，并给出千万级数据基准；可直接参考其扩展性工程骨架，但在本需求中应只把近邻/模糊分数用于召回或复核排序，不能替代 reference 硬证据。 | https://pypi.org/project/large-scale-entity-matching/ |
          | 基于 PySpark 的可扩展实体匹配项目，将 blocking 与主动学习结合；很适合把几百对黄金标签集中用于 reference 边界难例，训练辅助判别器并在大表上运行，同时通过严格 accept/review/reject 阈值维持 precision-first。 | https://pypi.org/project/Spark-Matcher/ |
          | 2026 年面向生产数据的 PySpark blocking + MinHash LSH 实践，重点讨论多路 blocking、数据倾斜与大规模候选缩减；可用品牌、reference 前缀/片段做 multi-pass blocking，既控制千万级增量计算成本，又尽量不漏掉真实同 reference 候选。 | https://data-dynamics.io/en/blog/pyspark-fuzzy-matching-lsh |
          | 专注腕表 reference 的资料库，并讨论同一 reference 下 Mk1/Mk2/Mk3 等外观演进；可用于构建品牌级 canonical reference 词典和别名规则，同时提醒系统不要把视觉差异错误解释成 reference 不同，图片应只做辅助校验。 | https://watch-ref.com/ |
          | GS1 标识符工具包把不同商品编号类型显式建模并提供解析、校验与 Global Model Number 等能力；可借鉴“先判编号角色、再规范化”的设计，把品牌 reference 与平台 SKU、店铺货号、内部商品 ID 隔离，降低把来源自有编号误当 reference 的误匹配风险。 | https://github.com/aidc-toolkit/gs1 |
          | 汽配跨境电商场景把品牌、MPN/OE 号作为精确识别核心，并强调不同平台对制造商编号和重复 listing 的处理；与腕表的字母数字 reference 高度同构，可借鉴“品牌门控 + 制造商编号优先 + 其他属性仅辅助”的保守匹配策略。 | https://zhuanlan.zhihu.com/p/1906392486395516491 |
          | 梳理 Brand、MPN、GTIN 与 identifier_exists 的使用边界，核心思想是没有可靠产品标识符时应明确缺失而不是猜测；可直接迁移为 reference 缺失或冲突时拒识，宁可漏匹配也不自动生成/猜型号。 | https://zhuanlan.zhihu.com/p/2025649770715195353 |
          EOF

          printf '\n' >> '奢侈品文章历史调研.md'
          cat <<'EOF' >> '奢侈品文章历史调研.md'
          | https://arxiv.org/abs/2312.15835 |
          | https://pypi.org/project/large-scale-entity-matching/ |
          | https://pypi.org/project/Spark-Matcher/ |
          | https://data-dynamics.io/en/blog/pyspark-fuzzy-matching-lsh |
          | https://watch-ref.com/ |
          | https://github.com/aidc-toolkit/gs1 |
          | https://zhuanlan.zhihu.com/p/1906392486395516491 |
          | https://zhuanlan.zhihu.com/p/2025649770715195353 |
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m '追加奢侈品文章调研（2026-08-18 b）'
          git push