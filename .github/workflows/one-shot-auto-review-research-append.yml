name: one-shot-auto-review-research-append

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-auto-review-research-append.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows and history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rows = [
              ("mpi-kanban 把 planner/worker/reviewer/verifier、共享任务与文件 claim、并行 batch 和 Kanban 状态放进同一仓库型工作流，并提供 Codex 原生 skill 适配；适合把已版本化 plan 拆成可审查任务，再由 reviewer/verifier 回写看板状态和证据。", "https://github.com/MadPonyInteractive/mpi-kanban/blob/main/PLAN.md"),
              ("agentao-kanban 将 Planner、Worker、只读 Reviewer、Verifier 固化为独立角色，并把看板状态、原始 transcript、版本化 prompt 与人类可读 reports 分层保存；适合把多 Agent 审查 finding 发布为看板事件/报告，同时保留可追溯证据。", "https://github.com/jin-bo/agentao-kanban"),
              ("claw-orchestrator 暴露按 commit SHA 运行的 codex_review 工具，并能通过 Codex app-server 设置长期 goal；适合让编排器把 plan 对应的候选提交精确交给 Codex 复审，再把结构化结果推进到长周期任务或看板。", "https://github.com/Enderfga/claw-orchestrator/blob/main/skills/references/tools.md"),
              ("figma-ds-workflows 提供专门给 Codex 的 Figma design-system audit/extract skills，并直接依赖 Figma MCP；适合把真实设计系统先做独立审计，再把 token/组件规范作为代码 reviewer 的设计侧约束输入。", "https://github.com/chelswcs/figma-ds-workflows"),
              ("CSG Design System 把 Figma 设计系统同步成可版本化的 DESIGN.md，Codex 直接通过 AGENTS.md 消费该规范；适合让设计依据与代码一起进入 Git 历史，并让 reviewer 按同一 token/组件契约核对实现。", "https://github.com/Seeed-Solution/csg-design-system/blob/main/README.md"),
              ("figma-design-sync 同时支持 Codex 与 Figma Console MCP，能用 sync-from-figma 对 Figma 变量和代码 token 做差异审计，并用 --fresh 保存设计快照；适合作为代码审查旁路的可重复设计一致性检查。", "https://github.com/lifesized/figma-design-sync"),
              ("Aura 可直接用 aura loop seed .aura/plans/PLAN.md 把既有计划转换成依赖图，再按 ready 集合调度 Crew 并结合验证/回滚；适合将 Codex plan 物化为可追踪执行 DAG，并把每个完成节点再绑定实际 Git 提交。", "https://github.com/Naridon-Inc/aura"),
              ("Codex #40037 提议用包含 scope contract、ownership chain、验证证据与 diff/artifact 摘要的紧凑 evidence packet 驱动动态多 Agent 升级/回退；适合让 reviewer/judge 只基于可观察证据决定重试、重规划、升级或发布结果，避免无界审查循环。", "https://github.com/openai/codex/issues/40037"),
              ("Codex #36720 提议维护可持久化 decision ledger，并让每条决定直接关联 files、commits、tests、issues/PR；很适合把“批准的 plan 决策 ↔ 实现 commit ↔ reviewer 证据”固化为可跨线程、多 Agent 读取的 provenance。", "https://github.com/openai/codex/issues/36720"),
              ("Codex #36718 提议为任务生成“需求→可观察证据”的结构化完成报告，并保留命令结果、失败/跳过检查及 machine-readable 输出；适合把多 Agent reviewer 的验证结果聚合后发布到看板或项目，而不是只留自然语言总结。", "https://github.com/openai/codex/issues/36718"),
              ("Codex #36219 要求父任务 Review 面聚合所有子 Agent 的最终改动，而不是只显示主 Agent 文件；可作为多 Agent code review 的完整性原则，确保看板/审查报告引用的是任务级真实 diff 而非不完整局部视图。", "https://github.com/openai/codex/issues/36219"),
              ("Codex #29530 提议给实现线程挂载只读 reviewer sidecar，并维护小型 review board、finding 状态和回传给 worker 的修复提示；与“独立审查 Agent→看板→Codex 修复线程”的闭环非常贴合。", "https://github.com/openai/codex/issues/29530"),
          ]

          article = Path("自动审查文章调研.md")
          history = Path("自动审查历史调研.md")
          article_text = article.read_text(encoding="utf-8")
          history_text = history.read_text(encoding="utf-8")
          known = {line.strip() for line in history_text.splitlines() if line.strip()}

          fresh = [(reason, url) for reason, url in rows if url not in known and url not in article_text]
          if fresh:
              article_append = "\n".join(f"| {reason} | {url} |" for reason, url in fresh)
              article.write_text(article_text.rstrip("\n") + "\n" + article_append + "\n", encoding="utf-8")
              history.write_text(history_text.rstrip("\n") + "\n" + "\n".join(url for _, url in fresh) + "\n", encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/one-shot-auto-review-research-append.yml
      - name: Commit appended research
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 自动审查文章调研.md 自动审查历史调研.md .github/workflows/one-shot-auto-review-research-append.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs: append new auto-review research"
            git push
          fi
