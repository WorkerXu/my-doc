name: Append GLiNER2 research

on:
  push:
    paths:
      - '.github/workflows/append-gliner2-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append researched items
        shell: python
        run: |
          from pathlib import Path

          additions = [
              (
                  "MeTNet 发布的 FEW-COMM 是中文电商少样本 NER 数据集，包含 66,165 条商家商品描述、140,936 个实体和 92 种由领域专家定义的商品属性类型（如材质、颜色、产地）；非常适合评估 GLiNER2 在新增类目/新增字段时的 few-shot 适配、中文长尾属性识别和动态 Schema 泛化。",
                  "https://github.com/hccngu/MeTNet",
              ),
              (
                  "该项目专门研究 NER 不完整标注，并公开工业电商 ecommerce 数据集；很适合处理商品品牌、型号、属性训练数据常见的漏标/弱标注问题，可用于构造 GLiNER2 的不完整标注鲁棒性基线和伪标注清洗方案。",
                  "https://github.com/allanj/ner_incomplete_annotation",
              ),
          ]

          article = Path("GLiNER2文章调研.md")
          article_text = article.read_text(encoding="utf-8")
          for reason, url in additions:
              if url not in article_text:
                  if article_text and not article_text.endswith("\n"):
                      article_text += "\n"
                  article_text += f"| {reason} | {url} |\n"
          article.write_text(article_text, encoding="utf-8")

          history = Path("GLiNER2历史调研.md")
          history_text = history.read_text(encoding="utf-8")
          for _, url in additions:
              if url not in history_text:
                  if history_text and not history_text.endswith("\n"):
                      history_text += "\n"
                  history_text += url + "\n"
          history.write_text(history_text, encoding="utf-8")

          Path(".github/workflows/append-gliner2-research.yml").unlink()
      - name: Commit appended research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "GLiNER2文章调研.md" "GLiNER2历史调研.md" .github/workflows/append-gliner2-research.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Append new GLiNER2 product extraction research"
          git push
