name: append-b-luxury-research-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append-b-luxury-research-once.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append new research rows without duplicates
        shell: python
        run: |
          from pathlib import Path

          research_path = Path("奢侈品文章调研.md")
          history_path = Path("奢侈品文章历史调研.md")

          rows = [
              (
                  "GraphER 将可解释的 Graph Differential Dependency 匹配规则用于引导 GNN 实体解析，适合把 brand+canonical reference 等硬规则置于学习模型之上；模型负责补充图结构证据，规则负责约束和否决冲突，可降低黑盒相似度造成的 false positive。",
                  "https://www.sciencedirect.com/science/article/pii/S0306437925000365",
              ),
              (
                  "这项 pool-based active learning 实体匹配工作专门用少量人工标注挑选最有价值的候选样本；与只有几百对黄金标签的约束高度吻合，可优先标注同品牌近似 reference、字段缺失和边界 hard cases，把有限标注预算集中到最容易误匹配的位置。",
                  "https://www.mdpi.com/2079-9292/13/3/559",
              ),
              (
                  "直接研究 ER 规则和数据持续演化时如何复用既有物化匹配结果，而不是每次全量重跑；适合百万到千万级三源持续增量，在新增记录或规则变化时只重算受影响部分，同时保留历史决策供审计。",
                  "https://www.vldb.org/vldb_journal/index.php/component/article_manager/article/1270",
              ),
              (
                  "详细区分 Omega serial number 与产品 reference，并给出从早期编号、MAPICS、8 位 PIC 到现行 14 位 PIC 的多代 reference 结构；可据此构建品牌专属 parser/canonicalizer，避免把序列号当型号，并严格保留点号、分段和变体位。",
                  "https://www.swisswatchclub.ie/watch-guides/omega-reference-guide/",
              ),
              (
                  "按 Rolex 系列列出大量 model reference，并说明不同位数和材质后缀等编号含义；可作为 brand-scoped canonical reference 字典，只有标题抽取出的数字命中字典和系列约束时才升级为强匹配证据，降低年份、尺寸等数字误识别。",
                  "https://www.oysterinfo.de/en/model-references/",
              ),
              (
                  "制造业‘一物多码’与跨供应商物料对齐和三源腕表同款识别高度同构，文章强调新增实时查重、跨来源对齐以及规则与算法结合；可借鉴先标准化型号/物料编码再进入审核闭环，避免仅凭描述相似度自动合并。",
                  "https://zhuanlan.zhihu.com/p/1949504429133924260",
              ),
          ]

          research = research_path.read_text(encoding="utf-8")
          history = history_path.read_text(encoding="utf-8")

          research_additions = []
          history_additions = []
          for reason, url in rows:
              if url not in research and url not in history:
                  research_additions.append(f"| {reason} | {url} |")
                  history_additions.append(f"| {url} |")

          if research_additions:
              research_path.write_text(
                  research.rstrip("\n") + "\n" + "\n".join(research_additions) + "\n",
                  encoding="utf-8",
              )
              history_path.write_text(
                  history.rstrip("\n") + "\n" + "\n".join(history_additions) + "\n",
                  encoding="utf-8",
              )

      - name: Commit and push append
        shell: bash
        run: |
          if git diff --quiet -- "奢侈品文章调研.md" "奢侈品文章历史调研.md"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "奢侈品文章调研.md" "奢侈品文章历史调研.md"
          git commit -m "docs: append b luxury matching research"
          git push origin HEAD:main
