name: b append gliner2 research 20260820 0621

on:
  push:
    paths:
      - '.github/workflows/b-append-gliner2-research-20260820-0621.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append b GLiNER2 research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('GLiNER2文章调研.md')
          history = Path('GLiNER2历史调研.md')
          entries = [
              ('GLiNER2 官方多语言模型 gliner2-multi-v1 直接展示 iPhone 15 Pro Max 的 name、storage、processor、price 结构化抽取，并覆盖英、法、西、德、意、葡等语言；适合直接验证多语言商品 brand/model/规格 Schema、CPU 本地部署与跨语言回归。', 'https://huggingface.co/fastino/gliner2-multi-v1'),
              ('Catalog Mind 可从商品图片或 CSV 自动生成结构化 attributes 与 metadata，并直接面向 Shopify、Amazon、Google Merchant Center 批量导出；适合对照 GLiNER2 的“文本字段主抽取 + 图片补证 + 目录批处理/渠道入库”落地形态。', 'https://www.catalogmind.com/'),
              ('CatalogEnrich 用多模型流水线从 CSV/PDF/PIM 等来源做商品属性富化，并配套人工复核、审计和回写电商系统；适合参考 GLiNER2 的批量字段抽取、低置信度 HITL、变更追踪与 PIM/ERP 回写治理。', 'https://catalogenrich.com/'),
              ('Wizzy Catalog Enrichment 同时读取商品标题与图片来生成 discovery-ready attributes，并覆盖材质、fit、pattern、occasion 等细粒度字段；适合把 GLiNER2 作为文本 brand/model/规格主抽取器，再以视觉链路补齐文本缺失属性并评估对搜索发现的增益。', 'https://wizzy.ai/agents/catalog-enrichment'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'{url}\n')
          PY

            if git diff --quiet -- 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'; then
              exit 0
            fi

            git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'
            git commit -m 'b 追加本轮 GLiNER2 商品字段调研 0621'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
