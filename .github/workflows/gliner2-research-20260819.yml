name: GLiNER2 Research Append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gliner2-research-20260819.yml'

permissions:
  contents: write

jobs:
  append-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new GLiNER2 research entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          article_path = Path('GLiNER2文章调研.md')
          history_path = Path('GLiNER2历史调研.md')

          rows = [
              (
                  'OneSearch 的开源代码在真实电商搜索链路中用 NER 维护 18 类结构化属性，直接包含 Brand、Model、Specifications、Color、Material，并把这些字段用于 query/item 语义增强；适合将 GLiNER2 作为动态 Schema 抽取器接入，验证品牌、型号和规格抽取对检索链路的实际增益。',
                  'https://github.com/benchen4395/onesearch-family'
              ),
              (
                  'OneRetrieval 的开源实现把电商 Brand、Model/GOOD_MODEL、Specification、Color、Material 等细粒度属性先抽取和归并，再编码进可检索的结构化表示；适合参考 GLiNER2 抽取后的字段分组、词典维护、增量更新以及“抽取→检索”衔接。',
                  'https://github.com/xuxinzhang/oneretrieval'
              ),
              (
                  'KuaiSearch 提供 1800 万级真实电商商品的 title+brand，以及 query/title/brand_name/attribute 相关性数据；可用现成目录字段构造 GLiNER2 品牌与属性弱标注/回归集，并直接评估抽取结果对召回、相关性和排序的业务价值。',
                  'https://github.com/benchen4395/KuaiSearch'
              ),
          ]

          article = article_path.read_text(encoding='utf-8')
          if article and not article.endswith('\n'):
              article += '\n'
          for reason, url in rows:
              if url not in article:
                  article += f'| {reason} | {url} |\n'
          article_path.write_text(article, encoding='utf-8')

          history = history_path.read_text(encoding='utf-8')
          if history and not history.endswith('\n'):
              history += '\n'
          existing = set(line.strip() for line in history.splitlines() if line.strip())
          for _, url in rows:
              if url not in existing:
                  history += url + '\n'
                  existing.add(url)
          history_path.write_text(history, encoding='utf-8')
          PY
          rm -f .github/workflows/gliner2-research-20260819.yml
      - name: Commit research updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: append new GLiNER2 product extraction research'
          git push
