name: Append AI sharing research d 20260827 r2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-research-d-20260827-r2.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          article = Path('ai分享文章调研.md')
          history = Path('ai分享历史调研.md')

          rows = [
              ('阿里云从 Agent Native Cloud 的整体架构解释 AgentRun、AgentTeams、AgentLoop 如何把运行时、协作治理、审计评估和持续优化组合成企业级 Agent 平台，适合分享“多 Agent 如何从功能编排升级为组织级基础设施”。', 'https://zhuanlan.zhihu.com/p/2062599702143672718'),
              ('文章把多智能体协同系统类比 Kubernetes，围绕 Worker、Team、Human、Manager、控制循环、Matrix 协作底座和 AI 网关展开，适合讲清“声明式编排 + 治理平面”如何支撑可复制、可治理、可演进的 Agent 团队。', 'https://zhuanlan.zhihu.com/p/2050905023157122907'),
              ('从企业 To B 落地视角系统讨论多 Agent 协作治理，覆盖 Leader-Worker、AI Registry、凭证托管、IM 人在回路、审计与成本控制，适合补充“技术编排之外，企业为什么还需要组织与安全治理”。', 'https://www.zhihu.com/question/2002294556490747945/answer/2057881050760721196'),
              ('Cornucopia Multi-Agent 提供顺序、并行、辩论、专家团队、审核和层级协作等多种模式，并配套多种通信拓扑、FastAPI 与可视化界面，适合用一个可运行项目对比不同协作结构及其适用场景。', 'https://zhuanlan.zhihu.com/p/2046654066827203602'),
              ('用 OpenClaw、Discord 与 ACP 实际搭建多个 Agent 的公开频道协作，并让 Agent 调用 Claude Code 或 Codex 执行编码任务，适合展示轻量多 Agent 团队如何通过通信空间、角色隔离和外部 Coding Agent 真正落地。', 'https://zhuanlan.zhihu.com/p/2018714727715467590'),
              ('通过 Claude 澄清需求、Gemini 设计原型、Codex 并行编码与测试组成端到端开发团队，并用 Skills 自动激活和质量门禁串联流程，适合分享跨模型 Agent 如何按能力分工而不是让单一模型包办全部研发环节。', 'https://zhuanlan.zhihu.com/p/2005277073036566597'),
              ('从真实开发任务依赖出发解释哪些任务可并行、哪些必须串行，并讨论多 Agent 同时改代码时的冲突问题，适合用于讲解 AI Coding 多 Agent 的任务图、并行度控制和协作边界。', 'https://zhuanlan.zhihu.com/p/2023489705921004804'),
              ('用 12 个 Claude Code Agent 按研发岗位组成完整团队，设置阶段流水线、契约节点、独立 QA、失败打回与人工兜底，适合展示多 Agent 规模扩大后如何靠流程门禁维持可交付性。', 'https://zhuanlan.zhihu.com/p/2045030955761521332'),
          ]

          history_only = [
              'https://zhuanlan.zhihu.com/p/2073698971579586072',
              'https://zhuanlan.zhihu.com/p/2070049291838796586',
              'https://zhuanlan.zhihu.com/p/2027036057879725626',
              'https://zhuanlan.zhihu.com/p/2029504755840422306',
              'https://zhuanlan.zhihu.com/p/1991985667622840199',
              'https://zhuanlan.zhihu.com/p/1963256630733931764',
              'https://zhuanlan.zhihu.com/p/2058598637865849320',
              'https://www.zhihu.com/question/663257446/answer/1966237381184185809',
              'https://www.zhihu.com/question/8880418451/answer/1991991583155983888',
              'https://zhuanlan.zhihu.com/p/2073795507827361064',
              'https://zhuanlan.zhihu.com/p/2024125267891733117',
              'https://zhuanlan.zhihu.com/p/2072726261705789795',
              'https://zhuanlan.zhihu.com/p/2060663639561000805',
              'https://zhuanlan.zhihu.com/p/2045902247062769700',
              'https://zhuanlan.zhihu.com/p/2061086733131945183',
              'https://zhuanlan.zhihu.com/p/2036090725960504167',
              'https://zhuanlan.zhihu.com/p/2059951663834781667',
              'https://zhuanlan.zhihu.com/p/2063224649643832677',
              'https://zhuanlan.zhihu.com/p/2070142074624668518',
          ]

          article_text = article.read_text(encoding='utf-8')
          history_text = history.read_text(encoding='utf-8')
          added_article = []
          added_history = []

          def append_history(url: str):
              global history_text
              if url in history_text:
                  return
              if history_text and not history_text.endswith('\n'):
                  history_text += '\n'
              history_text += f'| {url} |\n'
              added_history.append(url)

          for reason, url in rows:
              if url not in article_text and url not in history_text:
                  if article_text and not article_text.endswith('\n'):
                      article_text += '\n'
                  article_text += f'| {reason} | {url} |\n'
                  added_article.append(url)
              append_history(url)

          for url in history_only:
              append_history(url)

          if added_article:
              article.write_text(article_text, encoding='utf-8')
          if added_history:
              history.write_text(history_text, encoding='utf-8')

          print(f'added article rows: {len(added_article)}')
          print(f'added history rows: {len(added_history)}')
          PY

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'ai分享文章调研.md' 'ai分享历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'ai分享文章调研.md' 'ai分享历史调研.md'
          git commit -m 'docs: append ai sharing research d 20260827 r2'
          git push
