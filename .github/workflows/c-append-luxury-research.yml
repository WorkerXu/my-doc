name: c append luxury research

on:
  push:
    paths:
      - '.github/workflows/c-append-luxury-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows only
        run: |
          python - <<'PY'
          from pathlib import Path

          article_path = Path('奢侈品文章调研.md')
          history_path = Path('奢侈品文章历史调研.md')

          items = [
              (
                  'https://arxiv.org/abs/2401.00737',
                  '面向 SKU 商品目录的检索架构专门处理缩写和格式噪声，用 Trie 实时前缀检索与字符级 TF-IDF + 语言模型向量组成快慢两层；可用于千万级腕表 reference 候选召回，把连字符、空格、缩写等形式差异先收窄到少量候选，最终仍以 canonical reference 严格一致判同款。'
              ),
              (
                  'https://arxiv.org/abs/2601.19750',
                  'MMPCBench 系统评测电商商品缺失文本/图片模态补全，结果显示现有多模态大模型虽能抓住高层语义，却仍难保证细粒度词级与像素级对齐；对本项目的价值是明确把“根据图片生成/补全出的型号信息”限制为弱证据，不能替代真实 OCR/reference 硬证据，从而减少看似合理但型号错误的误匹配。'
              ),
              (
                  'https://link.springer.com/article/10.1007/s44163-026-01221-3',
                  '2026 年动态零售商品识别框架把视觉描述、OCR 文本和商品库 RAG 串成多阶段流程，最终只在检索出的候选商品 ID 中判断，并在证据不足时返回 none；它还展示近乎同包装商品会因缺少关键区分词发生混淆，适合迁移成“reference 候选受限 + 不确定即拒识”的腕表验证层。'
              ),
              (
                  'https://www.magstags.com/notes/product-identifiers-seo/',
                  '2026 年商品标识符实践文章把 GTIN、MPN、Brand 与内部 SKU 的角色边界拆得很清楚，并强调 MPN 必须结合品牌才具有稳定匹配意义、内部 SKU 不应当作跨商家身份标识；可直接用于三源数据的 identifier role 分类规则，先区分品牌 reference/MPN 与平台自有 SKU，再进入同 reference 精确匹配，避免“像型号的内部编号”造成跨源误合并。'
              ),
          ]

          history = history_path.read_text(encoding='utf-8')
          article = article_path.read_text(encoding='utf-8')

          new_items = [(url, reason) for url, reason in items if url not in history]

          if new_items:
              article_rows = [f'| {reason} | {url} |' for url, reason in new_items]
              article_sep = '' if article.endswith('\n') else '\n'
              article_path.write_text(article + article_sep + '\n'.join(article_rows) + '\n', encoding='utf-8')

              history_rows = [f'| {url} |' for url, _ in new_items]
              history_sep = '' if history.endswith('\n') else '\n'
              history_path.write_text(history + history_sep + '\n'.join(history_rows) + '\n', encoding='utf-8')

          Path('.github/workflows/c-append-luxury-research.yml').unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "chatgpt-c"
          git config user.email "chatgpt-c@users.noreply.github.com"
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md' '.github/workflows/c-append-luxury-research.yml'
          git commit -m 'c 追加奢侈品文章调研'
          git push origin HEAD:main
