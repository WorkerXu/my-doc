name: c-append-luxury-research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-append-luxury-research.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append deduplicated research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          research='奢侈品文章调研.md'
          history='奢侈品文章历史调研.md'

          append_one() {
            local url="$1"
            local reason="$2"
            if ! grep -Fq "$url" "$history" && ! grep -Fq "$url" "$research"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$research"
              printf '| %s |\n' "$url" >> "$history"
            fi
          }

          append_one 'https://arxiv.org/abs/2601.04200' '用 LLM 系统生成属性保持、受控负例与属性移除的电商合成数据，特别适合批量构造“品牌/系列/外观几乎一致、仅 reference 后缀或一位字符不同”的困难负例；可用少量黄金标签扩充高风险边界训练集，专门压低相邻型号 false positive。'
          append_one 'https://aclanthology.org/2024.emnlp-industry.17/' 'eBay 的生产研究用 dual-loss 专门学习“语义高度相关但实际不是正确结果”的 hard negatives；可把同系列相邻 reference 当作这类强混淆负例训练 blocking/reranker，让模型学会放大细粒度型号差异，而自动归并仍只接受 canonical reference 精确一致。'
          append_one 'https://aclanthology.org/2024.ecnlp-1.15/' '将电商检索按语义簇拆成局部 Cluster Language Models，使模型学习不同局部流形；可按品牌、系列或 reference family 建局部候选模型，降低全局表示把跨品牌或相邻系列混在一起的风险，并把最终 identity 判定继续交给 reference exact gate。'
          append_one 'https://arxiv.org/abs/2405.17533' 'PAE 联合非结构化文本与图片做商品属性抽取并执行 catalog matching，说明多模态抽取可在结构字段缺失时恢复细粒度属性；可迁移到标题、表背、保卡和吊牌中的 reference 候选抽取，之后再用品牌词典与 canonical reference 严格校验。'
          append_one 'https://arxiv.org/abs/2604.16950' 'AutoPKG 面向真实大型电商目录从文本和图片动态抽取属性，并通过集中决策 Agent 持续维护全局一致的 canonical Product-Attribute Knowledge Graph；适合三源持续增量时维护品牌/系列/reference 规范词典和冲突合并规则，减少不同来源写法漂移。'
          append_one 'https://github.com/deepseek-ai/DeepSeek-OCR' 'DeepSeek-OCR 是可本地部署的多模态 OCR/grounding 项目，可对商品图中的文字区域做识别与定位；适合从表背刻字、保卡、吊牌等恢复 reference 原始字符串并保留视觉证据，只有 OCR 与标题/品牌型号库一致时才进入自动匹配。'
          append_one 'https://github.com/PaddlePaddle/PaddleOCR' 'PaddleOCR 提供成熟的多语言 OCR、文档解析和结构化 JSON/Markdown 输出，并支持批量部署；适合百万级图片先抽取可能的 reference、型号和品牌字符，再以品牌专属正则/词典规范化，OCR 结果只作为可审计证据而非直接同款判据。'
          append_one 'https://github.com/zai-org/GLM-OCR' 'GLM-OCR 以较小模型提供复杂版面 OCR、信息抽取与高并发部署能力，可作为表背、证卡、标签等图片 reference 抽取的低成本生产基线；可与另一 OCR 引擎做双路一致性校验，分歧样本直接拒识或转人工。'
          append_one 'https://github.com/rednote-hilab/dots.ocr' 'dots.ocr 支持多语言文档解析、scene text spotting 与视觉文本定位，适合处理二奢图片中倾斜、背景复杂、语言混杂的型号文字；可作为第三路视觉 reference 候选来源，通过多引擎一致性与品牌格式校验提高 precision。'
          append_one 'https://zhuanlan.zhihu.com/p/2053890806650613781' '该 OCR/SKU 工程实践把规格/型号抽取、企业 SKU 库召回、分层判定、型号冲突拦截和人工复核闭环组合起来；其“高把握自动匹配、中等人工复核、低把握阻断”的流程可直接映射为 reference-first 的 precision 优先生产管线。'

          rm -f .github/workflows/c-append-luxury-research.yml
          git add -- "$research" "$history" .github/workflows/c-append-luxury-research.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: c append luxury article research'
            git push origin HEAD:main
          fi