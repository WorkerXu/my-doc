name: c append luxury research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/c-append-luxury-research.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append unique research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')

          rows = [
              ('https://arxiv.org/abs/2104.12589', '| 该研究直接证明朴素 transitive closure 可能显著降低实体匹配 precision，并用 cluster editing 在维持同一实体传递性的同时减少伪连接；非常适合三源腕表把不同有效 reference 设为硬冲突，避免一条错误 pairwise 边把整个簇串错。 | https://arxiv.org/abs/2104.12589 |'),
              ('https://www.akbc.ws/2020/papers/fR44nF03Rb', '| Contrastive Entity Linkage 专门处理“大量字段相同但其实是不同变体”的商品，并从非结构化文本自动挖掘能区分 variation 的属性且可扩展到百万实体；与同系列腕表仅 reference、尺寸或材质略有差异的 hard negative 高度一致，可用于差异证据抽取与保守复核。 | https://www.akbc.ws/2020/papers/fR44nF03Rb |'),
              ('https://openaccess.thecvf.com/content/WACV2022/html/Das_MAPS_Multimodal_Attention_for_Product_Similarity_WACV_2022_paper.html', '| MAPS 在真实 Amazon 商品目录上联合图片、标题和类目学习可扩展的多模态商品相似度，并报告 precision 提升；可作为 reference 缺失时的视觉候选召回/辅助验证器，尤其用于发现外观近似但型号不同的危险候选，最终仍由 canonical reference 放行。 | https://openaccess.thecvf.com/content/WACV2022/html/Das_MAPS_Multimodal_Attention_for_Product_Similarity_WACV_2022_paper.html |'),
              ('https://www.sciencedirect.com/science/article/pii/S2949719123000262', '| 该多模态 product matching 研究同时利用商品描述与图片，在公开 ABO 与工业库存数据上验证“某一模态信息不足时另一模态可补证”；适合字段稀疏腕表把图片作为独立旁证，但图文冲突或 reference 不一致时应直接拒识。 | https://www.sciencedirect.com/science/article/pii/S2949719123000262 |'),
              ('https://arxiv.org/abs/2205.15712', '| 该论文把 product matching 明确定义为跨来源识别 identical products，并专门讨论多源字段异构、缺失以及 Watches 数据；适合拿来做文本 matcher 的跨来源/多语言对照基线，同时验证在 reference 缺失或标题噪声下模型是否会误把相邻型号判同款。 | https://arxiv.org/abs/2205.15712 |'),
              ('https://www.sciencedirect.com/science/article/pii/S0950705124003137', '| AttendEM 用单一 Transformer 的多视图 ensemble、信息聚合 token 与额外 self-attention 提升实体匹配，在多组标准 EM 数据上优于多种强基线；可作为少量黄金标签下的二阶段候选复核器，并用 ensemble 一致性作为 high precision 自动接受的附加门槛。 | https://www.sciencedirect.com/science/article/pii/S0950705124003137 |'),
              ('https://ceur-ws.org/Vol-2720/paper3.pdf', '| 该产品匹配模型直接面向跨网站“是否同一商品”，针对类别不均衡与文本异构采用 BERT 加 self/inter-ensemble；可作为轻量的商品 pair classifier 对照，并把多模型一致才放行、分歧即 abstain 的策略迁移到可漏不可错场景。 | https://ceur-ws.org/Vol-2720/paper3.pdf |'),
          ]

          t = target.read_text(encoding='utf-8')
          h = history.read_text(encoding='utf-8')
          if t and not t.endswith('\n'):
              t += '\n'
          if h and not h.endswith('\n'):
              h += '\n'

          added = 0
          for url, row in rows:
              if url not in t and url not in h:
                  t += row + '\n'
                  h += f'| {url} |\n'
                  added += 1

          target.write_text(t, encoding='utf-8')
          history.write_text(h, encoding='utf-8')
          print(f'added={added}')
          PY
          git diff --check
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            echo 'No new rows to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'docs: append luxury product matching research'
          git push origin HEAD:main
