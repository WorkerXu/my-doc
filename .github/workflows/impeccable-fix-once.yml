name: Impeccable fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/impeccable-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix table newline and clean up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('impeccable调研总结.md')
          s = p.read_text(encoding='utf-8')
          needle = 'https://dev.to/ome_devlycan/impeccable-skill-building-web-pages-without-ai-slop-4i76 || Jamal Nichols'
          repl = 'https://dev.to/ome_devlycan/impeccable-skill-building-web-pages-without-ai-slop-4i76 |\n| Jamal Nichols'
          if needle not in s:
              raise SystemExit('expected joined table rows not found')
          p.write_text(s.replace(needle, repl, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/impeccable-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'impeccable调研总结.md' .github/workflows/impeccable-fix-once.yml
          git commit -m '修正 Impeccable 调研表格换行'
          git push origin HEAD:main
