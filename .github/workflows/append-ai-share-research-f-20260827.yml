name: Append AI share research f

on:
  push:
    paths:
      - ".github/workflows/append-ai-share-research-f-20260827.yml"

permissions:
  contents: write

jobs:
  append-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append new research entries
        shell: bash
        run: |
          set -euo pipefail
          article='ai分享文章调研.md'
          history='ai分享历史调研.md'

          append_article() {
            local url="$1"
            local reason="$2"
            if ! grep -Fq "$url" "$article"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
            fi
          }

          append_history() {
            local url="$1"
            if ! grep -Fq "$url" "$history"; then
              printf '| %s |\n' "$url" >> "$history"
            fi
          }

          append_article 'https://www.youtube.com/watch?v=ZVPlLaehjLk' '从 Workflows、Multi-Agent 一直讲到 Production 的框架化视角，适合在分享中先建立单 Agent、工作流与多 Agent 的边界，再讨论为什么生产系统需要更明确的编排与工程约束。'
          append_article 'https://www.youtube.com/watch?v=j_l-9uNX2SA' 'Google Cloud Tech 从架构层讨论多 Agent 系统，适合用于梳理职责拆分、协作拓扑和系统边界，并作为后续 ADK/A2A 实践案例的架构背景。'
          append_article 'https://www.youtube.com/watch?v=fCHe_fOqlYA' 'IBM Technology 重点讨论 Agent 系统构建与规模化挑战，适合补充多 Agent 从 Demo 扩展到真实系统后会遇到的复杂度、可靠性与工程治理问题。'
          append_article 'https://www.youtube.com/watch?v=EpATeUY30GI' 'A2A Workshop 直接面向可互操作多 Agent 系统进行实操，适合分享 Agent 发现、跨服务通信与协议化协作如何从概念落到可运行实现。'
          append_article 'https://www.youtube.com/watch?v=nGjGUCOiXk4' '用 Google ADK 与 A2A 让多个 Agent 协作完成游戏设计，是较具体的端到端案例，适合展示专业 Agent 如何分工、互相调用并共同完成一个可观察的任务。'
          append_article 'https://www.youtube.com/watch?v=ClWD8OEYgp8' 'GitHub 场景下“一名开发者、两打 Agent、零对齐”的协作复盘很适合做反例材料，用来讨论 Agent 数量增加后的人类注意力、上下文对齐、任务边界与协作成本为何会成为瓶颈。'
          append_article 'https://www.youtube.com/watch?v=WAFUMBLOjHo' '通过 CMUX 同时编排 Claude Code 与 Pi Agent 的演示，适合展示异构 Coding Agent 如何进入同一执行控制面，并观察跨 Agent 调度、并行任务与人工监督的实际工作方式。'

          append_history 'https://www.youtube.com/watch?v=ZVPlLaehjLk'
          append_history 'https://www.youtube.com/watch?v=j_l-9uNX2SA'
          append_history 'https://www.youtube.com/watch?v=fCHe_fOqlYA'
          append_history 'https://www.youtube.com/watch?v=EpATeUY30GI'
          append_history 'https://www.youtube.com/watch?v=nGjGUCOiXk4'
          append_history 'https://www.youtube.com/watch?v=ClWD8OEYgp8'
          append_history 'https://www.youtube.com/watch?v=WAFUMBLOjHo'

      - name: Commit appended research
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'ai分享文章调研.md' 'ai分享历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'ai分享文章调研.md' 'ai分享历史调研.md'
          git commit -m 'docs: append multi-agent YouTube research'
          git push
