name: Impeccable append once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/impeccable-append-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append researched cases and clean up
        shell: bash
        run: |
          set -euo pipefail
          FILE='impeccable调研总结.md'
          if ! grep -Fq 'https://jamalnichols.com/halo/' "$FILE"; then
            cat >> "$FILE" <<'EOF'
          | Jamal Nichols 在已上架 App Store 和 Google Play 的儿童睡前应用 Halo 中把 Impeccable 接入真实 Flutter + Claude Code 开发：先用 `teach-impeccable` 扫描代码库并把品牌与设计上下文固化到 `CLAUDE.md`，再在发版前反复运行 `audit/critique`。一次首页审查直接发现全站缺少 `Semantics()` 导致屏幕阅读器不可用，以及硬编码颜色在深色模式下不可见等缺陷；这些检查参与了应用从 FlutterFlow 原型迁移到正式 Flutter 产品并上线的质量收敛。 | https://jamalnichols.com/halo/ |
          EOF
          fi
          if ! grep -Fq 'https://growthmethod.com/agentic-design-stack/' "$FILE"; then
            cat >> "$FILE" <<'EOF'
          | Growth Method 创始人 Stuart Brameld 用 Claude Code + Impeccable 实际完成 Growth Method 官网和一个客户项目，两者都基于 Astro.js、均未配设计师。他先把 Impeccable 作为 design baseline，在写页面前锁定字体、色彩、间距与反模式，再按明确视觉方向逐 section 生成和迭代；首个 section 用于把审美方向调准，后续 section 直接复用已形成的设计系统，因此交付越来越快。这个案例体现了 Impeccable 在无设计师营销站项目中作为持续设计约束层的实际用法。 | https://growthmethod.com/agentic-design-stack/ |
          EOF
          fi
          rm -f .github/workflows/impeccable-append-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE" .github/workflows/impeccable-append-once.yml
          git commit -m '补充 Impeccable 实际落地案例'
          git push origin HEAD:main
