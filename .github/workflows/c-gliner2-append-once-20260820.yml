name: c GLiNER2 append once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message == 'chore: run c GLiNER2 append'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research rows idempotently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rows = [
              (
                  "ShopSavvy Python SDK 支持按 model number、条码、ASIN 或商品 URL 反查统一商品记录，并返回品牌等结构化字段且支持批量查询；适合把 GLiNER2 抽出的型号/品牌作为二阶段检索键，做跨零售商实体确认、型号纠错和目录归一。",
                  "https://github.com/shopsavvy/sdk-python",
              ),
              (
                  "Google Product Feed Enrichment Kit 会统一识别 GTIN/EAN/UPC、MPN/manufacturer_part_number 与 brand/manufacturer 等字段别名并检查标识符是否存在；适合接在 GLiNER2 后做品牌、MPN/型号字段归一和 Feed 入库前完整性校验。",
                  "https://github.com/Ads-insights/google-productfeed-enrichment-kit/blob/main/productfeed-identifier-exists.md",
              ),
              (
                  "Product Research Agent 已实现“商品搜索→品牌/规格抽取→Pydantic 结构化验证”的 Agent 流程，并支持从购物搜索结果汇总证据；适合给 GLiNER2 的低置信品牌、型号和规格增加联网补证与结构化复核层。",
                  "https://github.com/scarnyc/product-research-agent",
              ),
              (
                  "Bright Data 的 Amazon Global Dataset Scraper 输出商品 title/description 的同时提供 brand、manufacturer、model_number、Model Name、颜色、容量等结构化字段；适合持续生成 GLiNER2 品牌/型号/规格回归样本，并用商城结构化值自动做字段级差异校验。",
                  "https://github.com/luminati-io/amazon-products-global-dataset-scraper",
              ),
              (
                  "Meta Business SDK 的 ProductItem 目录对象直接定义 brand、GTIN、manufacturer_part_number、material、color 等字段；适合把 GLiNER2 的品牌、MPN/型号和属性输出映射到实际电商目录 Schema，并据目录字段约束设计入库质量门禁。",
                  "https://github.com/facebook/facebook-python-business-sdk/blob/main/facebook_business/adobjects/productitem.py",
              ),
          ]

          research_path = Path("GLiNER2文章调研.md")
          history_path = Path("GLiNER2历史调研.md")
          research = research_path.read_text(encoding="utf-8")
          history = history_path.read_text(encoding="utf-8")
          history_urls = {line.strip() for line in history.splitlines() if line.strip()}

          added = 0
          for reason, url in rows:
              if url in history_urls or url in research:
                  continue
              if research and not research.endswith("\n"):
                  research += "\n"
              research += f"| {reason} | {url} |\n"
              if history and not history.endswith("\n"):
                  history += "\n"
              history += url + "\n"
              history_urls.add(url)
              added += 1

          if added:
              research_path.write_text(research, encoding="utf-8")
              history_path.write_text(history, encoding="utf-8")
          print(f"added={added}")
          PY
          rm -f .github/workflows/c-gliner2-append-once-20260820.yml
          rm -f .github/c-gliner2-trigger-20260820.txt
      - name: Commit append and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GLiNER2文章调研.md GLiNER2历史调研.md .github/workflows/c-gliner2-append-once-20260820.yml .github/c-gliner2-trigger-20260820.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs: append c GLiNER2 research"
            git push
          fi
