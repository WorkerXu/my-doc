name: c append luxury research 20260818 2139

on:
  push:
    paths:
      - '.github/workflows/c-append-luxury-research-20260818-2139.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main
      - name: Append c luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('曼海姆大学 PyDI 覆盖数据加载、blocking、规则/机器学习实体匹配、聚类和结果评估，可直接搭建三源腕表的可复现实验管线；尤其适合把 brand+canonical reference 的硬规则作为主判据，再统一比较不同候选生成与复核策略。', 'https://github.com/wbsg-uni-mannheim/PyDI'),
              ('TAG Heuer 官方明确区分 reference number 与 serial number，并说明 reference 可识别确切型号且位于表背；非常适合建立“编号角色分类+图片/OCR取证”规则，避免把唯一到单只手表的序列号误当跨来源同型号身份。', 'https://faq.tagheuer.com/articles/en_US/FAQ/000001311/'),
              ('Chrono24 的腕表识别指南明确说明 reference/model number 对应整款腕表，而序列号、机芯号、壳号属于不同层级；可用于设计 reference、serial、component ID 的字段语义校验，先排除编号角色错误再做严格同 reference 匹配。', 'https://www.chrono24.com/magazine/how-can-you-find-out-which-watch-you-own-p_26063/'),
              ('知乎这篇 2026 电商 AI 工程文章直接以千万级 SKU 为容量背景，并把无结构标题抽取 brand、model 等结构化属性作为商品理解基础；与三源腕表“reference 埋在标题”高度同构，可借鉴零温度结构化抽取后再进入品牌内 reference 词典校验。', 'https://zhuanlan.zhihu.com/p/2048093768226694026'),
              ('知乎的跨平台比价实践把“同款匹配”明确建立在货号、型号、品牌、条码等强标识之上，再辅以参数与图片；这与 precision-first 需求一致，可把型号/reference 设为自动合并硬门槛，图片仅用于补充取证与冲突否决。', 'https://zhuanlan.zhihu.com/p/2017649799302783819'),
              ('retailerapi 的开源 MCP 将 UPC、EAN、ISBN、GTIN、ASIN 与零售商 item_id 统一解析成规范化商品摘要和标识集合；可借鉴其“多来源标识→canonical product”的接口层，为三平台 reference 建统一解析服务，同时把平台 SKU 与品牌 reference 分层保存。', 'https://github.com/retailerapi/mcp'),
              ('PARSeq 是高精度场景文字识别的官方实现，支持字母数字/标点字符集并输出置信度；很适合表背、保卡、吊牌上的 reference OCR，可把字符集和长度按品牌收紧，并对低置信结果直接拒识，避免一字符误读触发错配。', 'https://github.com/baudm/parseq'),
              ('STEP 将正则表达式直接作为 OCR 检测与识别条件，并专门测试 serial number 等结构化字母数字文本；可按品牌 reference 格式（前缀、位数、分隔符）约束表背/吊牌 OCR，只产生格式合法候选，再交 exact match，能显著降低无关文字和错字符误入身份键。', 'https://arxiv.org/abs/2309.02356'),
              ('该方法用正则/WFST 对结构化文本识别解码施加格式偏置，适合已知品牌 reference 语法的字母数字型号 OCR；可把格式先验融入解码而不是事后模糊纠错，并把不满足合法格式的结果拒识，更符合 precision-first。', 'https://arxiv.org/abs/2111.06738'),
              ('Schema.org 官方把 MPN 定义为制造商分配给产品的编号，可作为三源“manufacturer reference”字段语义的统一基线；先把该类制造商编号与平台/店铺自有编号分角色，再在 canonical brand 作用域内做严格等值，避免局部 SKU 越权成为跨源主键。', 'https://schema.org/mpn'),
              ('Schema.org 官方将 serialNumber 明确定义为某一具体实物实例的编号，而 MPN/reference 属于产品型号层；二奢腕表可据此先分类“型号级 reference / 单表 serial”，只允许前者做跨源同款键，避免把唯一到单只腕表的序列号误当同款 reference。', 'https://schema.org/serialNumber'),
              ('Panerai 官方 Find Your Watch 明确要求腕表 reference 以 PAM 开头并按 reference number 检索；可直接建立品牌专属格式校验与外部唯一性 lookup，标题/OCR 抽到的非 PAM 编号或无法唯一解析的结果一律不自动合并。', 'https://www.panerai.com/us/en/search/find-your-watch.html'),
              ('Panerai 官方 Strap Finder 同时接受 MX（配件）和 PAM（腕表）reference，清楚暴露“配件编号/适配腕表编号”并存的风险；可据此给表带、配件 listing 加 identifier-role 与商品类型硬校验，防止兼容/适配的 PAM 被误当当前售卖商品自身 reference。', 'https://www.panerai.com/us/en/search/find-your-strap.html'),
              ('积家官方手册检索同时区分“表背镌刻 reference”（如 221,8,86）与发票 product reference（如 Q2608140）；说明同一品牌可能存在多套 reference 表达，可据此建立 namespace-aware canonicalization，避免盲目去标点或跨编号体系误并。', 'https://www.jaeger-lecoultre.com/us-en/services/user-manual'),
              ('这篇腕表实务文章从表背刻字角度区分 Ref/型号与更长的表壳或出厂序列号，适合作为中文二手 listing 与图片 OCR 的编号角色样例；可先判断读到的是型号还是单表唯一号，再决定是否允许进入跨源 reference exact match。', 'https://zhuanlan.zhihu.com/p/31589060'),
              ('该文系统区分原厂 MPN Label、客户/渠道 CPN Label 与 Shipping Label 等标签编号角色；可迁移到表盒、保卡、吊牌图片 OCR 的字段分类，先确认读到的是制造商型号还是渠道/物流编码，只有前者才可提升为跨源强身份键。', 'https://zhuanlan.zhihu.com/p/4013239719'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          main_rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]
          history_urls = [url for _, url in entries if url not in hist_text]

          if main_rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in main_rows:
                      f.write(f'| {reason} | {url} |\n')

          if history_urls:
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for url in history_urls:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'c 追加本轮奢侈品文章调研'
          git push origin HEAD:main
