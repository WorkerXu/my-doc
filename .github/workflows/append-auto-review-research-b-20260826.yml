name: Append auto review research b 20260826

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research-b-20260826.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append 'TRIP 默认把规划、异构模型 plan review、分批实现、最终 code review 与 release commit/tag/push 串成闭环，适合把批准的计划文件作为提交前门禁并形成可审计的计划到 Git 提交节奏。' 'https://github.com/PiLastDigit/TRIP-workflow'
          append '用 spec.md 与 decision-log.md 作为 Claude Code/Codex 冷启动共享真源，并持久化 design.md、mockup.html、review.md、test-results.md；适合把设计审查证据与实现一起版本化供不同 Agent 复核。' 'https://github.com/hensonzyw-git/multi-agent-workflow'
          append '为 Codex 提供先写明确 UI implementation plan、再按多视口截图比较修复的视觉质量门，适合作为代码 reviewer 之外的独立设计实现审查 Agent。' 'https://github.com/Xialiang98/design-visual-frontend'
          append '把 Figma parent frame 到已交付功能封装成面向 Codex/Claude 的 8 阶段 orchestrator skill，适合把真实设计文件、实现、验证与审查收束成同一可重复流水线。' 'https://github.com/gwair1989/figma-full-cycle'
          append 'UI workflow 要求编码前形成显式设计计划、实现后做响应式截图 QA，并把真实 reviewer 反馈追加到 .codex/ui-visual-review-signals.md；适合把设计审查结果沉淀为仓库内可追踪工件。' 'https://github.com/Dirtytrii/codex-skills/blob/main/skills/ui-implementation-workflow/SKILL.md'
          append '通过官方 Figma MCP 抽取真实设计值、映射设计系统、实现后用 pixelmatch/SSIM 做客观视觉门禁，适合作为独立 design reviewer 给多 Agent 代码审查提供可量化设计证据。' 'https://github.com/jajupmochi/agent-harness/blob/main/skills/figma-design-fetch/SKILL.md'
          append '以本地 MCP + CLI 把 Codex、Claude Code 等编码 Agent 连接到同一任务板，适合把聚合 review findings 变成共享任务状态并在不同 Agent 间持续流转。' 'https://github.com/xyva-yuangui/agent-bridge'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research b 20260826'
          git push
