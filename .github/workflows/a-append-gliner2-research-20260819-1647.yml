name: a append gliner2 research 20260819 1647

on:
  push:
    paths:
      - '.github/workflows/a-append-gliner2-research-20260819-1647.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append a GLiNER2 research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('GLiNER2文章调研.md')
          history = Path('GLiNER2历史调研.md')
          entries = [
              ('OpenTag 原始工作把商品标题/描述中的开放词表属性值抽取建模为序列标注，并结合注意力与主动学习，在少量标注下发现训练中未见的新属性值；适合参考 GLiNER2 对长尾品牌、新型号、规格新值的开放抽取能力及低成本标注/难例采样策略。', 'https://www.amazon.science/publications/opentag-open-attribute-extraction-from-product-profiles'),
              ('该研究从非结构化多语言商品网页中抽取细粒度、标准化商品属性，并验证模型可跨网店、跨语言迁移，同时支持商品 taxonomy 对齐；适合评估 GLiNER2 的品牌/型号/规格字段在跨站点、多语言目录中的泛化，以及抽取后字段标准化与类目映射。', 'https://arxiv.org/abs/2302.12139'),
              ('这个 Ruby/ONNX 的 GLiNER2 推理封装直接给出 iPhone 商品结构化抽取示例，可一次得到完整型号、storage、processor、price 等字段，并支持 INT8 ONNX；适合参考 GLiNER2 商品品牌/型号/规格服务的跨语言封装、本地低成本部署和固定 Schema 输出。', 'https://github.com/elcuervo/gliner'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'{url}\n')
          PY

            if git diff --quiet -- 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'; then
              exit 0
            fi

            git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'
            git commit -m 'a 追加本轮 GLiNER2 文章调研 1647'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
