name: Append auto review research b 20260826 r2

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research-b-20260826-r2.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          ensure_newline() {
            local file="$1"
            if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then
              printf '\n' >> "$file"
            fi
          }

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          apply_rows() {
            ensure_newline "$article"
            ensure_newline "$history"
            append 'git read-tree 可把指定 tree-ish 读入独立 index，并支持 --index-output；适合在 CI 中从目标提交重建精确索引，再核对 PLAN.md 与实现代码是否属于同一树快照，从底层验证计划文件与提交绑定。' 'https://git-scm.com/docs/git-read-tree'
            append 'Codex 的 Orchestrated multi-agent PoC 把调查、计划、计划审批、执行和结果复审拆成有权限边界与重试预算的显式阶段，适合作为“先审 plan、再放行写代码、最后独立复审”的编排参考。' 'https://github.com/openai/codex/issues/32100'
            append 'Codex reusable multi-agent orchestration 提案要求先生成依赖图、明确 worker 读写所有权、并在最终集成前执行 validation waves，适合设计可复用的 planner/reviewer/worker 多 Agent 审查协议。' 'https://github.com/openai/codex/issues/21998'
            append 'multi-agent-dev-framework 采用 planner/reviewer + 并行 Codex workers，每个 worker 独立 git worktree，并在 merge 前走对抗式 review；适合把额外代码审查 Agent 接到计划驱动的并行实现流水线。' 'https://github.com/fzhiy/multi-agent-dev-framework'
            append 'claude-prism 用 Claude、Codex、Gemini 做跨 provider 交叉审查，并按可验证证据而非模型自报置信度给 finding 评分；适合作为 Codex 之外的独立 review council，降低同模型盲区和幻觉 finding。' 'https://github.com/tznthou/claude-prism'
            append 'figma-design-pipeline 把官方 Figma MCP 与设计审计、token 同步、代码生成能力组合起来，并支持 Codex/Claude/Gemini；适合让 design reviewer 同时读取真实设计结构与实现上下文，检查组件和 token 漂移。' 'https://github.com/spfr/figma-design-pipeline'
            append 'Figma MCP Server Guide 的评测 scorecard 明确覆盖 Figma 定位、真实 token/组件 fidelity、工具选择与错误恢复，可直接转成 design-review Agent 的机器可比较 rubric，而不是只输出主观视觉意见。' 'https://github.com/figma/mcp-server-guide/pull/64'
            append 'codex-agent-orchestration-skill 的 coding-review workflow 把 Technical Engineer、Code Reviewer、QA Tester 设成独立角色，并要求统一状态回执和最终汇总 commits、验证命令、findings 与风险，适合作为轻量审查编排模板。' 'https://github.com/lixuvip/codex-agent-orchestration-skill'
            append 'raven-mcp 可把 Figma 评论历史归档为 JSON/Markdown，并提供设计原则、pattern、token 等 design intelligence；适合把设计评审意见固化成可版本化证据，供代码 reviewer 与 Codex 后续复核。' 'https://github.com/rhinocap/raven-mcp'
            append 'Anthropic 最新 AI-Native SDLC playbook 明确建议把获批的 `plan.md` 一起提交进 Git，令计划进入审计链，并让 PR review 对照计划核验实现；若实现偏离计划应在同一提交更新 plan，最适合作为“plan 文件 ↔ commit”流程约束。' 'https://claude.com/blog/the-ai-native-sdlc-playbook'
            append 'GitHub Copilot code review 已支持 Agent Skills 与 MCP，把外部工具和团队标准带入每次审查；可接 Figma MCP/设计规则作为 Codex 之外的独立审查层，再把 surviving findings 回贴 PR 或后续看板。' 'https://github.blog/changelog/2026-06-02-shape-copilot-code-review-around-your-team/'
            append 'review-skills 的 debate-review 会让两个不同模型先对同一 PR 的 finding 进行“提出→反驳/降级→最终裁决”，babysit-pr 再验证、修复、回复并触发下一轮；可直接与 Codex/Claude 等组合成真正的交叉多 Agent review。' 'https://github.com/amElnagdy/review-skills'
            append 'Codex Design Review Skill 以只读方式审查 Figma 链接、截图、PDF 和设计变体，按 S0–S3 分级并可生成标注图；适合作为多 Agent 代码审查中的独立 design-reviewer，把设计文件证据与代码 findings 分离。' 'https://github.com/vip999611-ai/Codex-design-review-skill'
            append 'CodeXBoard 把 Codex 已固定的 thread 映射成可持续流转的 Kanban 卡片，并保留本地 notes、阶段与项目归属；适合作为聚合审查结果回流 Codex 后的长期“审查主题/项目”看板入口，让同一 thread 从 finding 跟踪到修复完成。' 'https://github.com/Moorvan/CodeXBoard'
          }

          git fetch origin main
          git reset --hard origin/main
          apply_rows

          if git diff --quiet -- "$article" "$history"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- "$article" "$history"
            git commit -m 'docs: append automatic review research b 20260826 r2'
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            apply_rows
            if git diff --quiet -- "$article" "$history"; then
              exit 0
            fi
          done

          exit 1
