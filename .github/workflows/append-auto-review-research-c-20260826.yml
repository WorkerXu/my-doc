name: Append auto review research c 20260826

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research-c-20260826.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append '该工作流要求把持久化的计划 ID/路径与当前完整 head/base SHA 一起写入交接和验证状态，可直接借鉴为 Codex PLAN.md ↔ Git 提交/范围的机器可读绑定协议。' 'https://github.com/shakacode/agent-workflows/blob/main/workflows/pr-processing.md'
          append 'Plan Review 可在计划获批前调用 Codex 或独立 Claude 做多轮只读审查，并把每版计划与审查记录持久化到仓库工作区，适合作为提交前的计划质量门。' 'https://github.com/dachev/plan-review'
          append 'AgentReview 由编排器把 PR diff 并行分发给质量、安全、文档代理，并通过 MCP 调用 Roslyn、Semgrep、GitHub 后汇总排序结果，适合作为 Codex 之外的独立多 Agent 复核层。' 'https://github.com/vondraysanford/AgentReview'
          append 'agentic-atdd 把规格同步到 GitHub Issues，代码阶段并行运行架构/意图 reviewer，并持续吸收 CI 与机器人 review 反馈，适合把多 Agent findings 直接变成可追踪的看板任务闭环。' 'https://github.com/mpiton/agentic-atdd'
          append 'Figma MCP Bridge 能把当前打开的 Figma 文件、截图、变量、设计 token 与 token 使用审计直接暴露给 Agent，适合让 design reviewer 用真实设计文件/设计系统上下文核对 Codex 生成代码。' 'https://github.com/Liar0320/figma-mcp-bridge'
          append 'figma-spec-search 能在大型 Figma 文件中定位规则、标注、状态和设计依据并返回原始节点链接，适合让代码审查 finding 可回溯到具体设计证据，而不是只靠模型主观判断。' 'https://github.com/zicator/figma-spec-search'
          append 'pinfix 把运行中 React 页面上的 Figma 式视觉批注直接写成仓库 Markdown 任务，并记录组件链与源码文件，可把设计审查结果无损转成 Codex 可消费、可版本化的修复队列。' 'https://github.com/VianneyBertrand/pinfix'
          append 'AgentBoard 以卡片承载 Codex/Claude/Cursor 会话并通过生命周期 hooks 展示等待、运行和完成状态，可作为把 reviewer 线程与审查结果集中回流到本地项目看板的轻量承载层。' 'https://github.com/mikky-a/agentboard'
          append 'Tribunal 使用不同厂商 AI CLI 进行结构化多轮辩论并保留异议后给出裁决，适合作为代码 reviewer、设计 reviewer 之后的独立最终 judge，降低单一模型共识偏差。' 'https://github.com/kdoubt/tribunal'

      - name: Commit research updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '自动审查文章调研.md' '自动审查历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '自动审查文章调研.md' '自动审查历史调研.md'
          git commit -m 'docs: append automatic review research c 20260826'
          git push
