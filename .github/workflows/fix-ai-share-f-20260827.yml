name: Fix AI sharing preservation f 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-share-f-20260827.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore unchanged existing URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ai分享文章调研.md')
          text = path.read_text(encoding='utf-8')
          wrong = 'https://zhuanlan.zhihu.com/p/2015796905158926426'
          original = 'https://zhuanlan.zhihu.com/p/2015796905158923426'
          if wrong in text:
              text = text.replace(wrong, original)
              path.write_text(text, encoding='utf-8')
              print('restored existing URL')
          else:
              print('nothing to restore')
          PY

      - name: Commit restoration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'ai分享文章调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'ai分享文章调研.md'
          git commit -m 'docs: restore unchanged ai sharing URL'
          git push
