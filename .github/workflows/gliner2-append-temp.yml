name: GLiNER2 Research Append Temp

on:
  push:
    paths:
      - '.github/workflows/gliner2-append-temp.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append researched links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          article='GLiNER2文章调研.md'
          history='GLiNER2历史调研.md'

          append_item() {
            local url="$1"
            local reason="$2"
            if ! grep -Fq "$url" "$article"; then
              printf '%s\n' "| $reason | $url |" >> "$article"
            fi
            if ! grep -Fxq "$url" "$history"; then
              printf '%s\n' "$url" >> "$history"
            fi
          }

          append_item 'https://www.width.ai/post/product-attribute-enrichment-2026' 'Width.ai 的 2026 商品属性富化实践明确把 brand、model、voltage、color、weight 等作为结构化目标字段，并强调先做来源检索再按规则、示例和阈值生成/校验；适合让 GLiNER2 负责固定 Schema 的快速抽取，再用来源证据与阈值复核型号和规格，降低脏目录中的误抽与幻觉。'
          append_item 'https://help.akeneo.com/using-ai-in-the-pim/what-is-web-based-attribute-enrichment' 'Akeneo 2026 的 Web-based Attribute Enrichment 已在 PIM 中落地“缺失字段→联网查证→带来源建议→人工/工作流审核”，用例直接包含 brand、manufacturer、model 和技术规格；适合把 GLiNER2 作为现有标题/描述/供应商文档的一阶段本地抽取器，仅对缺失或低置信字段触发联网补证。'
          append_item 'https://www.productdatascrape.com/automated-product-matching-by-model-number.php' '这篇 2026 商品目录实践专门围绕 model number 自动抽取与跨商城匹配，强调型号作为同款识别、去重、目录标准化和持续更新的核心标识；适合把 GLiNER2 的 model/model number/MPN 抽取结果接到规范化与商品匹配层，并据匹配冲突反向发现型号误抽。'
          append_item 'https://aimodels.deepdigitalventures.com/blog/ai-models-for-ecommerce-catalog-enrichment-which-models-best-clean-up-product-titles-attributes-and-categories/' '该 2026 目录富化选型文章建议把批量标题清洗、Schema 可靠的属性抽取、复杂类目推理和多模态兜底分层处理；很适合 GLiNER2 作为低成本本地 brand/model/属性主抽取器，仅将难例、隐式属性或图片证据缺失的商品升级到更强模型，控制大规模目录处理成本。'

          if ! git diff --quiet -- "$article" "$history"; then
            git add "$article" "$history"
            git commit -m '追加GLiNER2商品字段提取调研'
            git push origin HEAD:main
          fi
