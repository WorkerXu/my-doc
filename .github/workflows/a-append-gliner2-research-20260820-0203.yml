name: a append gliner2 research 20260820 0203

on:
  push:
    paths:
      - '.github/workflows/a-append-gliner2-research-20260820-0203.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append a GLiNER2 research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('GLiNER2文章调研.md')
          history = Path('GLiNER2历史调研.md')
          entries = [
              ('X5 Tech 的零售搜索 NER 实战直接从短且噪声较大的商品查询中抽取 TYPE、BRAND、VOLUME、PERCENT，并围绕线上速度与准确率设计流水线；很适合作为 GLiNER2 品牌、商品类型、容量/百分比等字段在真实搜索词噪声下的生产基线与回归参考。', 'https://habr.com/ru/companies/X5Tech/articles/941634/'),
              ('Naratix 的电商目录富化案例从原始商品 Feed/非结构化输入按类目抽取 size、color、material、weight、dimensions、technical specs 等字段，再做 canonical Schema 归一化、同义值映射和验证回流；适合参考 GLiNER2 的“类目 Schema→多属性抽取→标准化→质检/反馈”完整落地闭环。', 'https://agixtech.com/case-studies/naratix/'),
              ('Agility AI 的生产案例用 NER 从多语言、格式混乱的商品/运输描述中抽取 Brand、Type、Processing、Grade、Form、Origin，并采用离线 ONNX INT8 部署与字段覆盖率评估；适合参考 GLiNER2 品牌/类型等字段的本地化部署、噪声文本鲁棒性和逐字段覆盖率门禁。', 'https://agilitytech.ai/case-studies/hsn-classification'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'{url}\n')
          PY

            if git diff --quiet -- 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'; then
              exit 0
            fi

            git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'
            git commit -m 'a 追加本轮 GLiNER2 文章调研 0203'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
