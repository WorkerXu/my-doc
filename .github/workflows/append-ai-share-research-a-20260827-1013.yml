name: Append AI share research a 20260827 1013

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-ai-share-research-a-20260827-1013.yml'

permissions:
  contents: write

jobs:
  append-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append unique research rows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ARTICLE='ai分享文章调研.md'
          HISTORY='ai分享历史调研.md'

          append_selected() {
            local reason="$1"
            local url="$2"
            if ! grep -Fq "$url" "$HISTORY"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$ARTICLE"
              printf '| %s |\n' "$url" >> "$HISTORY"
            fi
          }

          append_history_only() {
            local url="$1"
            if ! grep -Fq "$url" "$HISTORY"; then
              printf '| %s |\n' "$url" >> "$HISTORY"
            fi
          }

          apply_entries() {
            append_selected 'Atlassian 复盘 Rovo 从“协调器+产品专家子 Agent”的层级式多 Agent 架构迁移到 Long Horizon：直接公开子 Agent 摘要传递造成的信息损失、路由僵化和模型迁移成本，并给出扁平工具、按需子实例、上下文压缩与轨迹追踪的新方案，特别适合分享“什么时候多 Agent 反而成为瓶颈”。' 'https://www.atlassian.com/blog/how-we-build/rovo-long-horizon-reasoning-engine'
            append_selected 'Atlassian 用 Jira 看板把复杂 Coding 任务拆成可调度状态机，Designer、Builder、QA 子 Agent 只接收单一工单和验收标准，并用 In Progress 作为锁、评论作为审计记录、人工做最终 Review，适合展示“外部任务状态+角色隔离+可验收交付”如何抑制 Agent 漂移。' 'https://www.atlassian.com/blog/development/specialist-agent-orchestration-jira'
            append_selected 'LinkedIn 把多 Agent 当成分布式系统来落地：用 gRPC 定义 Agent 服务契约、Skill Registry 做发现、现有消息系统承载 FIFO、并行线程、持久重试与最终交付，再由生命周期服务适配消息与 RPC，适合讲企业级协作系统如何复用成熟基础设施而不是另造一套编排。' 'https://www.linkedin.com/blog/engineering/generative-ai/the-linkedin-generative-ai-application-tech-stack-extending-to-build-ai-agents'
            append_selected 'Snowflake ArcticSwarm 面向企业深度研究设计“先隔离探索、再通过 Gated Bulletin Board 协作验证”的多 Agent 架构，刻意延迟共识并把分歧当成验证工具，适合分享多 Agent 协作中“信息隔离、共享时机与共识机制”如何工程化。' 'https://www.snowflake.com/en/blog/engineering/arcticswarm-multi-agent-system-architecture/'
            append_selected 'Agent Taskflow 将 Agent 通信、LLM 调用、工具、记忆和聊天事件统一放到 Confluent 事件流上，并结合 Schema Registry、IAM 与 Bedrock 构建面向大规模并发的后端，适合讲“多 Agent 编排首先是消息、契约、背压、可靠性与可观测性问题”。' 'https://www.confluent.io/blog/agent-taskflow-ai-agents-confluent-aws-architecture/'
            append_selected 'Datadog 的生产遥测显示 59% 的 Agent 请求仍只有一次服务调用、仅 18% 会跨 3 个以上服务；同时指出走向多 Agent 或微服务后必须把上下文与 Trace 贯穿服务边界并让 Service Map 纳入工具，适合用真实运行数据校准多 Agent 落地成熟度。' 'https://www.datadoghq.com/state-of-ai-engineering/'
            append_selected 'Golutra 是近期活跃的多 Agent 开发编排平台，把 Codex、Claude Code、OpenClaw 等统一在同一控制面里，支持并行执行、任务编排与长时间工作流，适合做“多模型 Coding Agent 如何产品化成统一工作台”的项目案例。' 'https://github.com/golutra/golutra'
            append_selected 'speckit-agents 把 PM Agent 与 Dev Agent 放进 Mattermost 协作，并用 Spec Kit 的 specify、plan、tasks、implement、状态机、Git worktree 隔离和人工介入串成可观察的自动交付流程，适合展示“规范驱动+聊天协作+隔离分支”如何落到代码交付。' 'https://github.com/sbhavani/speckit-agents'
            append_selected 'codex-orchestrator 采用 Claude Code 做协调与 QA、Codex CLI 做并行执行，并用追加式任务契约、技术栈 Profile、沙箱、任务记录和可验证验收标准约束 Worker，适合分享“协调仲裁模型+执行模型”的异构 Agent 团队如何控制质量和并发。' 'https://github.com/shuaige121/codex-orchestrator'

            append_history_only 'https://www.snowflake.com/en/blog/engineering/arcticswarm-hybrid-deep-research/'
            append_history_only 'https://github.com/B0Qi/skill-multi-agent'
            append_history_only 'https://openclaw.academy/blog/how-sharbel-runs-business-four-openclaw-ai-agents/'
            append_history_only 'https://www.atlassian.com/blog/rovo/how-rovo-embraces-multi-agent-orchestration'
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            apply_entries

            if git diff --quiet -- "$ARTICLE" "$HISTORY"; then
              echo 'No new entries to append.'
              exit 0
            fi

            git add "$ARTICLE" "$HISTORY"
            git commit -m 'docs: add fresh multi-agent collaboration research'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying from latest main"
          done

          echo 'Failed to push after retries' >&2
          exit 1
