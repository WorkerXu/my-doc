name: c append gliner2 research 20260819 1624

on:
  push:
    paths:
      - '.github/workflows/c-append-gliner2-research-20260819-1624.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append c GLiNER2 research rows
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          main = Path('GLiNER2文章调研.md')
          history = Path('GLiNER2历史调研.md')
          entries = [
              ('Shopee TH/SG 的 Product Taxonomy Extraction 项目把品牌/商品体系归一、LLM 多模态字段抽取和 43 个类目的数据管道放在同一工程中；适合参考 GLiNER2 的“类目路由→brand/model/属性 Schema→抽取→品牌/商品规范化→数仓入库”完整落地链路。', 'https://github.com/iethes/product-taxonomy-extraction'),
              ('Firecrawl 的 Amazon 商品案例用 Pydantic/JSON Schema 约束网页抽取并明确采集品牌等商品详情字段；适合放在 GLiNER2 前后作为网页正文获取与结构化 Schema 对照，尤其参考 PDP 批量采集、字段契约和可验证输出。', 'https://github.com/firecrawl/firecrawl/blob/main/examples/blog-articles/amazon-price-tracking/notebook.md'),
              ('这篇电商 Schema 设计指南专门讨论跨 Amazon、Shopify 等不同站点抽统一商品字段，并以 brand、SKU 等作为商品页基础字段；适合指导 GLiNER2 按商品详情页设计 brand/model/规格 Schema、处理字段缺失与跨站差异。', 'https://scrapewithruno.com/blog/schema-design-ecommerce/'),
              ('该多模态电商数据富化研究用“规则手册 + 动态 Prompt”按商品类型确定应抽属性并输出指定结构，且规则式提示显著优于零样本；适合迁移到 GLiNER2 的类目专属 Schema、属性定义约束、图片补证和抽取一致性校验。', 'https://www.bibliomed.org/?mno=243170'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'{url}\n')
          PY

            if git diff --quiet -- 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'; then
              exit 0
            fi

            git add 'GLiNER2文章调研.md' 'GLiNER2历史调研.md'
            git commit -m 'c 追加本轮 GLiNER2 文章调研 1624'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          exit 1
