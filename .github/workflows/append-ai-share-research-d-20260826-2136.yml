name: Append AI share research d 20260826 2136

on:
  push:
    paths:
      - '.github/workflows/append-ai-share-research-d-20260826-2136.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new AI share research rows
        shell: bash
        run: |
          set -euo pipefail
          article='ai分享文章调研.md'
          history='ai分享历史调研.md'

          ensure_newline() {
            local file="$1"
            if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then
              printf '\n' >> "$file"
            fi
          }

          history_has() {
            local url="$1"
            grep -Fqx "| $url |" "$history" || grep -Fqx "$url" "$history"
          }

          article_has() {
            local url="$1"
            grep -Fq "$url" "$article"
          }

          append_recommended() {
            local reason="$1"
            local url="$2"
            if history_has "$url"; then
              return 0
            fi
            if ! article_has "$url"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
            fi
            printf '| %s |\n' "$url" >> "$history"
          }

          append_history_only() {
            local url="$1"
            if ! history_has "$url"; then
              printf '| %s |\n' "$url" >> "$history"
            fi
          }

          apply_rows() {
            ensure_newline "$article"
            ensure_newline "$history"
            append_recommended '从 Tool Runtime 到单/多 Agent 选型，再到 LangGraph 状态图与 AutoGen、CrewAI 的适用边界，强调只有任务天然多阶段、异构工具或目标冲突时才值得多 Agent；适合作为分享中“何时需要多 Agent + 如何把流程状态显式化”的工程判断素材。' 'https://zhuanlan.zhihu.com/p/2074892026299139660'
            append_recommended '基于 Codex 实际使用拆出跨项目新线程、会话 ID 接力、一对多并行等场景，并强调项目路径、任务状态、执行方式和验收要求；适合做 AI Coding 多 Agent 调度的轻量可复现实操。' 'https://zhuanlan.zhihu.com/p/2070504892796498056'
            append_recommended '以多个 AI Agent 在同群协作为问题，复盘并发冲突、防碰撞、新鲜度门控等协调机制，并把哪些问题交给代码、哪些交给提示词讲清；适合作为多 Agent 共享上下文和冲突治理的工程案例。' 'https://zhuanlan.zhihu.com/p/2074191821815668796'
            append_recommended '系统覆盖顺序、并行、层级、辩论四种协作架构，AutoGen、CrewAI、LangGraph 选型、内容团队代码实践以及幻觉、成本、协调、安全避坑，适合做分享里的全景架构地图与最小实现示例。' 'https://zhuanlan.zhihu.com/p/2074211818957029552'
            append_recommended '从真实并行 Coding Agent 工作流出发，明确哪些任务适合或不适合并行，并给出 Plan→Prompt→Verify→Review 闭环、统一命令与验证报告；适合讲多 Agent 提速后的真正瓶颈如何转向任务拆分和 Review。' 'https://zhuanlan.zhihu.com/p/2040814536345792826'
            append_recommended '把可工程化多 Agent 定义为协调、专业执行、独立验证和统一运行时，强调结构化交接、状态恢复、结果验证与成本收益；适合用作分享开场的设计原则基线，避免把多 Agent 误解为自由聊天。' 'https://zhuanlan.zhihu.com/p/2069012163067491985'
            append_history_only 'https://zhuanlan.zhihu.com/p/2072726261705789795'
            append_history_only 'https://zhuanlan.zhihu.com/p/2060663639561000805'
            append_history_only 'https://zhuanlan.zhihu.com/p/2048702272364876312'
            append_history_only 'https://zhuanlan.zhihu.com/p/2065815369789526890'
          }

          git fetch origin main
          git reset --hard origin/main
          apply_rows

          if git diff --quiet -- "$article" "$history"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- "$article" "$history"
            git commit -m 'docs: append AI share research d 20260826'
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            apply_rows
            if git diff --quiet -- "$article" "$history"; then
              exit 0
            fi
          done

          exit 1
