name: Append auto review research a 20260826 r4

on:
  push:
    paths:
      - '.github/workflows/append-auto-review-research-a-20260826-r4.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append new research rows
        shell: bash
        run: |
          set -euo pipefail
          article='自动审查文章调研.md'
          history='自动审查历史调研.md'

          ensure_newline() {
            local file="$1"
            if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then
              printf '\n' >> "$file"
            fi
          }

          append() {
            local reason="$1"
            local url="$2"
            if ! grep -Fqx "$url" "$history"; then
              printf '| %s | %s |\n' "$reason" "$url" >> "$article"
              printf '%s\n' "$url" >> "$history"
            fi
          }

          apply_rows() {
            ensure_newline "$article"
            ensure_newline "$history"
            append '该 Codex Desktop 真实故障展示了长任务中用户规格被 Agent 自行改写、却仍宣称验证完成的风险；很适合作为强制“已批准 plan/spec 不可被 reviewer 自动扩权”、并要求端到端证据才能关闭审查任务的反例依据。' 'https://github.com/openai/codex/issues/40560'
            append 'Hermes Agent 的 review 子系统已支持独立 reviewer provider/model，并进一步讨论 review 专用 reasoning_effort；适合作为 Codex 之外的第二审查引擎，让编排器显式区分实现模型与高强度审核模型。' 'https://github.com/NousResearch/hermes-agent/issues/94793'
            append 'agenttrail 可实时观察 Codex、Claude Code、Cursor 的计划、工具调用、文件改动和进度；适合给“plan 文件 ↔ commit ↔ 多 Agent review”链路增加独立审计层，便于把实际执行证据再推送到项目看板或审查文章。' 'https://github.com/sodiumsun/agenttrail'
            append 'flow-alignment 提供面向 Claude Code 与 Codex 的用户流研究和可点击 wireframe 对齐能力，可在 Figma/设计文件正式审查之外先生成可执行的交互基线，让 design reviewer 同时核对视觉稿、用户流与代码实现。' 'https://github.com/C-ZW/flow-alignment'
          }

          git fetch origin main
          git reset --hard origin/main
          apply_rows

          if git diff --quiet -- "$article" "$history"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- "$article" "$history"
            git commit -m 'docs: append automatic review research a 20260826 r4'
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            apply_rows
            if git diff --quiet -- "$article" "$history"; then
              exit 0
            fi
          done

          exit 1
