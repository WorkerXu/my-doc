name: b append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/b-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main
      - name: Append b luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('异构、多模态工程部件的实体匹配实测显示 Random Forest/XGBoost 等轻量监督模型可接近 SOTA，LLM 成本高且混合方案增益有限；很适合先把品牌、规范化 reference、标题证据和图像校验信号做成可解释特征，用少量标注训练高精度 verifier，而不是让大模型直接决定合并。', 'https://www.cambridge.org/core/journals/proceedings-of-the-design-society/article/entity-matching-for-recurring-engineering-components-a-bottomup-enabler-for-reference-architecture-reconstruction/B5A60E41B7701424645B97FBEE0716A0'),
              ('项目把 ASIN、Best Buy SKU、商品 URL 等多种输入统一解析到稳定 canonical product，并加入跨源合并、confidence gating 与别名缓存；可借鉴其“全局商品 ID + 多来源标识别名 + 低置信拒识”的工程模式，支撑三源持续增量且避免重复创建实体。', 'https://github.com/ask-poly/askpoly'),
              ('Walmart 在约 2 亿商品索引上用 cross-batch negatives、cross-encoder 验证和元数据启发式挖掘高质量 hard negatives；可用于百万到千万级候选召回和“同品牌同系列但不同 reference”难负例构造，最终匹配仍由 reference 硬规则/高精度验证器裁决。', 'https://arxiv.org/abs/2607.10096'),
              ('专门针对视觉-语言模型难以区分高语义相似 hard negatives 的问题设计负例采样与提示学习；可把同系列、外观近似但 reference 不同的腕表图文对作为困难负例训练辅助验证器，让图像只承担冲突否决和补强证据，降低视觉相似造成的误合并。', 'https://www.sciencedirect.com/science/article/pii/S0950705126003436'),
              ('给出“有统一标识 / 无统一标识”的商品匹配实操流程，强调从页面完整采集标识、JSON-LD、图片和后台元数据再统一规范化；可直接迁移为 brand+reference 优先、字段缺失时多证据降级且允许不匹配的采集与判定管线。', 'https://groupbwt.com/blog/product-matching/'),
              ('把“从图中识别部件 → 提取 part number → 回查精确 SKU 目录”做成端到端目录匹配流程；对腕表可类比用表背、保卡、吊牌图片提取 reference，再在品牌 reference 词典中精确确认，适合作为标题缺失型号时的辅助证据链。', 'https://opendrawing.ai/blog/ai-part-number-search-catalog-matching/'),
              ('开源的聚类、清洗与外部 reconciliation 工具适合离线发现品牌别名、reference 分隔符/大小写/前后缀规范化规则，并可重放清洗操作到新批次；可作为规则和词典生产台，不作为千万级线上最终 matcher。', 'https://openrefine.org/'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          main_rows = [(reason, url) for reason, url in entries if url not in main_text]
          history_urls = [url for _, url in entries if url not in hist_text]

          if main_rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in main_rows:
                      f.write(f'| {reason} | {url} |\n')

          if history_urls:
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for url in history_urls:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'b 追加本轮奢侈品文章调研'
          git push origin HEAD:main
