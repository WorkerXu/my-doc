name: b append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/b-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main
      - name: Append b luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('Octopart 搜索先用 trigram 容错召回，再明确要求精确场景对返回 MPN 做字符级 exact 过滤；适合 reference 近邻候选可召回、自动合并只认完整型号逐字符一致。', 'https://www.altium.com/documentation/altium-developer-center/octopart/api/search'),
              ('两阶段 OCR+结构化抽取直接产出 part_number 和原始 OCR，可迁移到表背/保卡图片的 reference 提取；保留原文证据便于后接品牌格式与 exact gate。', 'https://github.com/thedatasense/PaddleOCR_Engineering_Drawings'),
              ('专门把 OCR 拆开的料号片段合并为 exact 查询，并只在空结果时有限放宽；适合 O/0、空格/分段噪声下先恢复 reference 候选，再严格验证。', 'https://github.com/controlguy-ys/electronic-parts-finder-mcp'),
              ('从自由 BOM 文本抽内嵌 SKU/part number 并给置信度，适合借鉴标题埋 reference 的轻量抽取与低置信拒识。', 'https://github.com/jjheffernan/makemcmasterBOM/blob/main/docs/backend/mcmaster.md'),
              ('抽取结构化规格时同步输出 part number、revision 等 verification data，可借鉴“抽取结果必须可被独立证据验证”的 reference 升级机制。', 'https://github.com/akiselev/datasheet-cli'),
              ('自动商品匹配把 model number、brand 等设为类目相关属性并限制候选属性空间；可用品牌/类目先收窄，再把型号冲突作为否决信号，减少语义近似误并。', 'https://patents.google.com/patent/US12106351B1/en'),
              ('Rakuten 大规模电商预处理显式加入 model-number extractor，将型号从噪声商品文本中先结构化；适合千万级标题先抽 reference 再进入严格匹配。', 'https://aclanthology.org/anthology-files/pdf/C/C16/C16-1051.pdf'),
              ('搜索 NER/实体匹配实践强调词典高精度与模型泛化互补；可把品牌 reference 词典做 precision-first 主通路，模型只补候选且未命中保持拒识。', 'https://zhuanlan.zhihu.com/p/428782080'),
              ('增量导入时按 MPN、供应商/竞争对手/客户料号等不同角色识别潜在重复，并交数据管理员确认；适合持续增量和编号角色冲突的人工 review 安全层。', 'https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fapim/how-items-are-matched.html'),
              ('把 datasheet/MPN 事实抽取做成证据、质量评分和 trust gate，只有 verification-backed 结果升级为可信；很适合 reference OCR/标题抽取后的可审计放行。', 'https://github.com/aklofas/kicad-happy'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          main_rows = [(reason, url) for reason, url in entries if url not in main_text]
          history_urls = [url for _, url in entries if url not in hist_text]

          if main_rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in main_rows:
                      f.write(f'| {reason} | {url} |\n')

          if history_urls:
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for url in history_urls:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'b 追加本轮奢侈品文章调研'
          git push origin HEAD:main
