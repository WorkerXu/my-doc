name: b append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/b-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append b luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('淘宝 WWW26 生成式检索实践把商品 Embedding 与 RQ-VAE Codebook 联合训练，并直接用“同款商品簇”作为监督信号；可借来让同 reference 商品在候选表示空间更稳定聚合，同时把相邻不同 reference 作为 hard negatives，最终仍由 canonical reference 严格一致收口。', 'https://zhuanlan.zhihu.com/p/2065491120172300172'),
              ('阿里妈妈百亿级营销图实践直接包含“同款异常点检测”，把 SKU、同款边和模型 score 建图后用 1-hop/2-hop 邻域发现簇内异常；很适合三源 reference 聚类后的 false-positive 审计，及时发现误连边，避免错误关系在商品簇中继续传播。', 'https://www.nebula-graph.com.cn/posts/use-case-alimama'),
              ('2026 年跨 Marketplace 商品匹配工程指南把 EAN/UPC/GTIN/model number 作为最高置信层，结构化属性次之，标题与图片只作为受控辅助，并明确强调 match precision 优先、歧义项交人工；与“可漏不可错”的 reference-first 流程高度一致。', 'https://www.actowizsolutions.com/product-matching-across-marketplaces.php'),
              ('2026 年商品标识实践系统区分 GTIN、SKU、MPN 在跨店商品身份中的角色，并强调稳定标识应优先于标题语义做匹配/去重；可借来完善“制造商 reference/MPN 与平台 SKU 分角色”的数据治理，减少不同来源自有编号造成的错误合并。', 'https://blog.shopti.ai/posts/product-identifiers-gtin-sku-mpn-ai-shopping-agents-structured-data/'),
              ('2026 年商品匹配评测指南要求从缺失标识、属性冲突、近似变体、替代品等高风险样本建标注集，并检查 calibrated confidence、证据、人工复核与可逆写回；很适合把几百对黄金标签集中到相邻 reference hard cases，以 precision 和误合并可追溯性作为上线门槛。', 'https://getclaro.ai/resources/guides/how-to-evaluate-product-matching-software/'),
              ('2026 年“无共享 GTIN”商品匹配方案把 manufacturer identity、规范化 part number、规格、包装等多证据组合，并明确弱字段不能独立代表身份；可直接映射到腕表“品牌 + normalized reference”为强键、图片/标题仅补证，证据不足就拒识。', 'https://getclaro.ai/resources/guides/how-to-match-supplier-products-without-gtin/'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'b 追加本轮奢侈品文章调研'
          git push
