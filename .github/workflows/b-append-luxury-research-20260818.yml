name: b append luxury research 20260818

on:
  push:
    paths:
      - '.github/workflows/b-append-luxury-research-20260818.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append b luxury research rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          entries = [
              ('SIGIR 2026 把电商商品自由文本先转成类别感知属性图，再在结构化属性上重排候选，零样本平均精度提升且明显减少 token；可先从稀疏标题结构化品牌、系列与 reference 候选，再在受限候选内检索，减少纯语义向量把相邻型号混在一起。', 'https://arxiv.org/abs/2604.27410'),
              ('LEMONADE 专门面向少量且有噪声标签的实体匹配，LLM 只在训练阶段生成困难样本并把知识迁移到轻量模型，论文还用近似产品版本说明易错边界；很适合用几百对黄金标签强化相邻 reference hard negatives，同时保持大规模推理成本可控。', 'https://www.sciencedirect.com/science/article/pii/S0950705125022725'),
              ('ING 的 EntityMatchingModel 可在 Pandas/Spark 上做 millions×millions 候选匹配，组合字符/词 TF-IDF、余弦近邻、Sorted Neighbourhood 与置信度分类器；可作为千万级三源数据的 Blocking 工程参考，把候选压到极小集合后再由 brand+canonical reference 硬规则最终裁决。', 'https://github.com/ing-bank/EntityMatchingModel'),
              ('腕表行业文章明确 reference number 标识精确型号与规格，而 serial number 标识单只腕表，并介绍不同品牌的编号结构及异常格式风险；可据此建立品牌作用域的 reference 解析、格式校验和序列号排除规则，降低把相邻型号或个体序列号误当跨源主键。', 'https://kigu.app/blog/watch-reference-numbers-explained'),
              ('AWS Entity Resolution 2026 年 7 月把 Exact、ExactManyToMany 与 AND/OR 高级规则扩展到毫秒级实时匹配；适合持续增量三源商品用 brand+canonical reference 的确定性组合规则即时生成稳定 match ID，并让模糊证据无法单独触发自动合并。', 'https://aws.amazon.com/about-aws/whats-new/2026/07/aws-entity-resolution/'),
              ('这篇实体消歧实战强调“大模型适合做提取器、不应做裁判”，身份判定应由可审计规则承担，相似度只能作线索，冲突项进入人工确认且原始记录保留；与“reference 严格一致、绝不能误匹配”的 precision-first 设计高度一致。', 'https://zhuanlan.zhihu.com/p/2058664296960222147'),
          ]

          main_text = main.read_text(encoding='utf-8')
          hist_text = history.read_text(encoding='utf-8')
          rows = [(reason, url) for reason, url in entries if url not in main_text and url not in hist_text]

          if rows:
              with main.open('a', encoding='utf-8') as f:
                  if main_text and not main_text.endswith('\n'):
                      f.write('\n')
                  for reason, url in rows:
                      f.write(f'| {reason} | {url} |\n')
              with history.open('a', encoding='utf-8') as f:
                  if hist_text and not hist_text.endswith('\n'):
                      f.write('\n')
                  for _, url in rows:
                      f.write(f'| {url} |\n')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '奢侈品文章调研.md' '奢侈品文章历史调研.md'
          git commit -m 'b 追加本轮奢侈品文章调研'
          git push
