name: c GLiNER2 append 20260820

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/c-gliner2-append-20260820.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message == 'c: trigger GLiNER2 append 20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append researched items
        shell: bash
        run: |
          set -euo pipefail
          ARTICLE='GLiNER2文章调研.md'
          HISTORY='GLiNER2历史调研.md'
          WORKFLOW='.github/workflows/c-gliner2-append-20260820.yml'

          ensure_newline() {
            file="$1"
            if [ -s "$file" ] && [ "$(tail -c 1 "$file" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$file"
            fi
          }
          ensure_newline "$ARTICLE"
          ensure_newline "$HISTORY"

          add_item() {
            url="$1"
            row="$2"
            if ! grep -Fq "$url" "$ARTICLE"; then
              printf '%s\n' "$row" >> "$ARTICLE"
            fi
            if ! grep -Fqx "$url" "$HISTORY"; then
              printf '%s\n' "$url" >> "$HISTORY"
            fi
          }

          add_item 'https://huggingface.co/spaces/fastino/gliner2-official-demo' '| GLiNER2 官方 Demo 的商品 Schema 直接抽取 name、brand、SKU、price、available_colors、available_sizes、stock_quantity、rating 等字段；可直接复用为品牌/SKU/规格落地样例，用于字段边界、结构化输出和回归测试。 | https://huggingface.co/spaces/fastino/gliner2-official-demo |'
          add_item 'https://www.diffbot.com/docs/extract/product' '| Diffbot Product API 对商品页统一输出 brand、SKU、MPN、GTIN、specs 等字段；可作为 GLiNER2 brand/model/MPN/规格 Schema 与网页抽取结果的外部对照，尤其适合定义 SKU/MPN 边界和字段归一化。 | https://www.diffbot.com/docs/extract/product |'
          add_item 'https://docs.zyte.com/zyte-api/usage/reference.html' '| Zyte API 的商品抽取 Schema 明确区分 brand、SKU、MPN、GTIN 等标识字段，并支持单商品页自动抽取；适合用作 GLiNER2 网页商品抽取的标准字段契约与对照真值，验证型号/MPN 与卖家 SKU 的边界。 | https://docs.zyte.com/zyte-api/usage/reference.html |'

          rm -f "$WORKFLOW"
          git config user.name 'WorkerXu'
          git config user.email '819972341@qq.com'
          git add "$ARTICLE" "$HISTORY" "$WORKFLOW"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'c: 追加 GLiNER2 商品字段提取调研'
          git push origin HEAD:main
