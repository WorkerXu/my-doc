name: b luxury research temp

on:
  push:
    paths:
      - '.github/workflows/b-luxury-research-temp.yml'

permissions:
  contents: write

jobs:
  repair-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair row boundary and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "b-research-bot"
          git config user.email "b-research-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path

          target = Path('奢侈品文章调研.md')
          history = Path('奢侈品文章历史调研.md')
          t = target.read_text(encoding='utf-8')
          h = history.read_text(encoding='utf-8')
          t = t.replace(
              'https://ojs.aaai.org/index.php/AAAI/article/view/37370 || 该经典实体解析工作',
              'https://ojs.aaai.org/index.php/AAAI/article/view/37370 |\n| 该经典实体解析工作',
          )
          h = h.replace(
              '| https://ojs.aaai.org/index.php/AAAI/article/view/37370 || https://vldb.org/vldb_journal/index.php/component/article_manager/article/1105 |',
              '| https://ojs.aaai.org/index.php/AAAI/article/view/37370 |\n| https://vldb.org/vldb_journal/index.php/component/article_manager/article/1105 |',
          )
          target.write_text(t, encoding='utf-8')
          history.write_text(h, encoding='utf-8')
          PY
            git rm -f -- '.github/workflows/b-luxury-research-temp.yml'
            git add -- '奢侈品文章调研.md' '奢侈品文章历史调研.md'
            git commit -m "research: repair table boundary and clean temp workflow"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
