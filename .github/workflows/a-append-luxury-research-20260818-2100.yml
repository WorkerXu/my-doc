name: a append luxury research 20260818

on:
  push:
    paths:
      - .github/workflows/a-append-luxury-research-20260818-2100.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append researched links
        shell: bash
        run: |
          set -euo pipefail
          article="奢侈品文章调研.md"
          history="奢侈品文章历史调研.md"

          append_pair() {
            local url="$1"
            local reason="$2"
            if ! grep -Fq -- "$url" "$history"; then
              printf '\n| %s | %s |' "$reason" "$url" >> "$article"
              printf '\n| %s |' "$url" >> "$history"
            fi
          }

          append_pair "https://arxiv.org/html/2606.24407" "把大规模实体解析做成有限批次 oracle 查询的 pay-as-you-go 过程，用相似图、分区和预算内批次选择提升每次人工或强校验能确认的关系量；很适合只有几百对黄金标注时把审核预算集中到高价值候选。论文假设 oracle 一致，因此本需求应只让人工或 reference 硬校验充当 oracle，LLM 仅做候选组织，避免误合并。"
          append_pair "https://www.openproceedings.org/2024/conf/edbt/paper-14.pdf" "WDC Products 用真实多店商品构造 corner-case、unseen-entity 与小开发集三维基准，并明确包含文本极像但并非同款的 hard negatives；可直接借鉴来构造同品牌相邻 reference、单字符差异、持续新增未见型号的压力测试集，以 precision 和 false-positive 为首要门槛验证匹配器。"
          append_pair "https://openreview.net/forum?id=DASh78rJ7g" "该工作把 selective classification 与 OOD detection 统一为可拒识的可靠分类，并给出有理论依据的 plugin estimators；可用于 reference 缺失或冲突、陌生品牌以及新来源分布漂移时主动 abstain，把自动匹配限制在低风险接受区，宁可漏匹配也不产生 false positive。"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$article" "$history"
          if ! git diff --cached --quiet; then
            git commit -m "追加 a 本轮奢侈品文章调研"
            git push
          fi